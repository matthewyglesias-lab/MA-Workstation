name: Integrated appointment pagination and compact review
on:
  push:
    branches: [codex/premium-workstation-composition]
    paths: [.github/workflows/density-appointment-review.yml]
permissions:
  contents: read
concurrency:
  group: density-appointment-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'matthewyglesias-lab/MA-Workstation' && github.ref == 'refs/heads/codex/premium-workstation-composition'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
      TEST_STANDALONE_FILE: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed pagination and preference-test changes
        run: |
          test "$(git rev-parse HEAD^)" = 16f358ec34b014fd8d23cd95ec4b3d0f9245c042
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          echo '1ccfabf6a3f7ec52aac20aec93e2d74a7ab17e2dc2d47909c5a0c031eabe34d5  docs/density-appointment/pagination-fix.patch' | sha256sum -c -
          echo '62fffad19e9bad6e0af2526aceaef12f9d637572c605ddec69f0b8bba13be265  docs/density-appointment/preference-tests.patch' | sha256sum -c -
          git apply --check --index docs/density-appointment/pagination-fix.patch docs/density-appointment/preference-tests.patch
          git apply --index docs/density-appointment/pagination-fix.patch docs/density-appointment/preference-tests.patch
          git rm -- docs/density-appointment/pagination-fix.patch docs/density-appointment/preference-tests.patch .github/workflows/density-appointment-review.yml
          test "$(git write-tree)" = 47d43f53b5ae2a901fd044bfdc76051384511f59
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve long AVS instructions on explicit follow-up pages'
          git push origin HEAD:refs/heads/codex/premium-workstation-composition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - name: Full-history unit verification
        run: mkdir -p review-evidence && npx vitest run --reporter=default --reporter=json --outputFile=review-evidence/unit.json
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Complete affected browser journeys and actual PDF output
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/focused.json
        run: npx playwright test tests/e2e/density-and-appointment.spec.js tests/e2e/control-details.spec.js tests/e2e/premium-composition.spec.js tests/e2e/modal-ownership.spec.js tests/e2e/kiosk-flow.spec.js tests/e2e/print-regression.spec.js tests/e2e/calm-workspace.spec.js --retries=0 --reporter=line,json,html
      - name: Preserve all focused screenshots and PDFs
        if: always()
        run: mkdir -p review-evidence && if [ -d test-results ]; then cp -r test-results review-evidence/focused-captures; fi
      - name: Generate candidate screen images for visual inspection
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/visual-candidates.json
        run: npx playwright test tests/e2e/visual-snapshots.spec.js tests/e2e/lightfully-shell.spec.js --retries=0 --update-snapshots --reporter=line,json,html
      - name: Record candidate images; independent full PR CI is still required
        run: |
          git add -- tests/e2e/visual-snapshots.spec.js-snapshots/linux tests/e2e/lightfully-shell.spec.js-snapshots/linux
          if ! git diff --cached --quiet; then
            git commit -m 'test: record reviewed-density image candidates for independent full regression'
            git push origin HEAD:refs/heads/codex/premium-workstation-composition
          fi
      - name: Archive source and exact review identity
        if: always()
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/COMMIT.txt
          git rev-parse HEAD^{tree} > review-evidence/TREE.txt
          git status --short > review-evidence/WORKING-TREE.txt
          git archive HEAD | gzip > review-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-appointment-pagination-review
          path: |
            review-evidence/
            test-results/
            playwright-report/
            tests/e2e/visual-snapshots.spec.js-snapshots/linux/
            tests/e2e/lightfully-shell.spec.js-snapshots/linux/
          retention-days: 7
          if-no-files-found: error
