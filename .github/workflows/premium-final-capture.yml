name: Premium final focused verification
on:
  push:
    branches: [codex/premium-workstation-composition]
    paths: [.github/workflows/premium-final-capture.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
      TEST_STANDALONE_FILE: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply two exact corrections and remove this temporary workflow
        run: |
          test "$GITHUB_REF" = refs/heads/codex/premium-workstation-composition
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib, hashlib, subprocess
          edits = [
            ('tests/e2e/kiosk-flow.spec.js', '73f5fec3e8ec63896193eeb5b7d3d719708fa67764b2077be1700ba151e11c8c',
             '''await panel.locator('input[placeholder="Last, First"]').evaluate(node => node.focus());''',
             'await editor.evaluate(node => node.focus());',
             '0b1572299991cb3319bc662adf84a09e3302261788101418f6d115fc46fea619'),
            ('src/presentation/lightfully/shell-layout.css', '0767ebc71cf02a48fa3837e3f32c97bef95dcbc7f3986707dea1b0818b9568d9',
             '  @media (max-height: 700px) {\n',
             '  @media (max-height: 700px) {\n    #lf-workstation .lf-service-header { min-height: 52px; padding-block: 8px; }\n',
             '55599d6acc9e572f449c6bd357ca2cf49473b324acb0b891703e4cfff7b2d604')]
          prepared=[]
          for path,before,old,new,after in edits:
              p=pathlib.Path(path); raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==before, 'Changed preimage: '+path
              text=raw.decode(); assert text.count(old)==1
              result=text.replace(old,new).encode()
              assert hashlib.sha256(result).hexdigest()==after
              prepared.append((p,result))
          for p,result in prepared:p.write_bytes(result)
          pathlib.Path('.github/workflows/premium-final-capture.yml').unlink()
          assert not pathlib.Path('.review-transport').exists()
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix: reclaim short-screen working space and verify the retained signed editor'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/premium-workstation-composition'],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - name: Unit verification
        run: mkdir -p review-evidence && npx vitest run --reporter=default --reporter=json --outputFile=review-evidence/unit.json
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Focused complete journeys; fail immediately on any failed test
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/focused.json
        run: npx playwright test tests/e2e/premium-composition.spec.js tests/e2e/modal-ownership.spec.js tests/e2e/kiosk-flow.spec.js tests/e2e/conventions.spec.js --retries=0 --reporter=line,json,html
      - name: Preserve focused screenshots and reports
        if: always()
        run: cp -r test-results review-evidence/focused-captures 2>/dev/null || true
      - name: Screen reference candidates
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/candidates.json
        run: npx playwright test tests/e2e/visual-snapshots.spec.js tests/e2e/lightfully-shell.spec.js --update-snapshots --retries=0 --reporter=line,json,html
      - name: Record candidates for inspection and final read-only PR CI
        run: |
          git add tests/e2e/visual-snapshots.spec.js-snapshots/ tests/e2e/lightfully-shell.spec.js-snapshots/
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all('/linux/' in p and p.endswith('.png') and p.startswith('tests/e2e/') for p in paths)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'test: capture premium screen references for independent final review'
            git push origin HEAD:refs/heads/codex/premium-workstation-composition
          fi
      - name: Archive exact source and identity
        if: always()
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/COMMIT.txt
          git rev-parse HEAD^{tree} > review-evidence/TREE.txt
          git archive HEAD | gzip > review-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-final-focused-review
          path: |
            review-evidence/
            test-results/
            playwright-report/
            tests/e2e/visual-snapshots.spec.js-snapshots/linux/
            tests/e2e/lightfully-shell.spec.js-snapshots/linux/
          retention-days: 7
          if-no-files-found: error
