name: Validate and publish reviewed local refinement
on:
  push:
    branches: [codex/ipmg-local-workstation-refinement]
    paths: [.github/workflows/resume-reviewed-refinement.yml]
# One-use transport for exact reviewed edits, not an ongoing write-enabled bot.
# No secrets or deployment actions; the payload and this workflow self-remove.
permissions:
  contents: write
jobs:
  reviewed-candidate:
    if: github.repository == 'matthewyglesias-lab/MA-Workstation' && github.ref == 'refs/heads/codex/ipmg-local-workstation-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact parent, patch and resulting source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b9b65e9e452a302e1bca981abb3de00dfbacf740
          cat .github/review/resume-{1,2,3,4,5}.txt | base64 --decode | gzip --decompress > "$RUNNER_TEMP/reviewed.patch"
          echo "263539ecc2deaf8a32a0379b3702bf3da403cca3b1a11129bebfcf4602c7f788  $RUNNER_TEMP/reviewed.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          python3 - <<'PY'
          import subprocess
          expected = {
            'docs/local-refinement/CONTINUED-acceptance.md',
            'src/presentation/ContextDialog.tsx',
            'src/presentation/ModalDialog.tsx',
            'src/presentation/RecordActionDialog.tsx',
            'src/presentation/WorkstationLookupDialog.tsx',
            'src/presentation/lightfully/final-polish.css',
            'src/presentation/lightfully/use-backdrop-dismiss.ts',
            'src/presentation/records-drawer-shared.ts',
            'src/presentation/workflows/ClinicalRegister.tsx',
            'src/presentation/workflows/log/DailyCloseoutPanel.tsx',
            'src/presentation/workflows/uds/UdsPanel.tsx',
            'tests/e2e/deep-refinement.spec.js',
            'tests/e2e/kiosk-flow.spec.js',
            'tests/e2e/lightfully-shell.spec.js',
            'tests/e2e/uds-record-integrity.spec.js',
            'tests/e2e/workstation.spec.js',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected patch paths: {changed ^ expected}')
          PY
          git rm .github/workflows/resume-reviewed-refinement.yml .github/review/resume-{1,2,3,4,5}.txt
          test "$(git write-tree)" = cc2d708aeb631521364df4eefc148d378f4dd376
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finish deep Lightfully interactions and preserved browser journeys' -m 'Apply exact reviewed presentation and test edits. Preserve clinical, storage, print and AVS boundary. Remove the one-use patch transport. Draft PR #68 only; no deployment or merge.'
          mkdir -p review-proof
          git rev-parse HEAD > review-proof/COMMIT.txt
          git rev-parse HEAD^{tree} > review-proof/TREE.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Protect clinical, storage and print behavior
        run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - name: Unit regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit | tee review-proof/unit-results.txt
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install chromium
      - name: Exact candidate browser and local-file review
        env:
          TEST_STANDALONE_FILE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-proof/browser-results.json
        run: >-
          npx playwright test
          tests/e2e/deep-refinement.spec.js
          tests/e2e/lightfully-direction.spec.js
          tests/e2e/local-refinement.spec.js
          tests/e2e/contemporary-workspace.spec.js
          tests/e2e/injection-full-draft-safety.spec.js
          tests/e2e/uds-record-integrity.spec.js
          tests/e2e/print-regression.spec.js
          tests/e2e/standalone-file.spec.js
          tests/e2e/kiosk-flow.spec.js
          --reporter=line,json,html
      - name: Publish tested candidate to draft branch only
        run: git push origin HEAD:refs/heads/codex/ipmg-local-workstation-refinement
      - uses: actions/upload-artifact@v4
        with:
          name: continued-lightfully-standalone
          path: standalone/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continued-lightfully-review-evidence
          path: |
            review-proof/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
