name: Prepare isolated UI review
on:
  push:
    branches: [codex/lightfully-standalone-rebuild]
    paths: ['.github/workflows/prepare-local-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - name: Package exact test renderer
        run: tar -czf review-renderer.tar.gz -C "$HOME/.cache/ms-playwright" chromium_headless_shell-1234 ffmpeg-1011
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-browser-review
          path: review-renderer.tar.gz
          retention-days: 1
