name: Apply and verify standalone shell
on:
  push:
    branches: [codex/lightfully-standalone-rebuild]
    paths: ['.github/lightfully-rebuild-data/**', '.github/workflows/lightfully-rebuild-apply.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lightfully-rebuild-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/lightfully-standalone-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lightfully-standalone-rebuild
          fetch-depth: 0
      - name: Verify and apply reviewed UI patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/lightfully-rebuild-data').glob('*.part'))
          assert len(parts) == 5
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts)))
          assert hashlib.sha256(patch).hexdigest() == 'b99b84b7267d7b7b1c3c0ea007d0df9ef6c8b36a5628ab457ee0981b6da7712d'
          path = pathlib.Path('/tmp/lightfully-reviewed.patch')
          path.write_bytes(patch)
          check = subprocess.run(['git','apply','--check',str(path)], capture_output=True)
          if check.returncode == 0:
              subprocess.run(['git','apply',str(path)],check=True)
          else:
              subprocess.run(['git','apply','--reverse','--check',str(path)],check=True)
              print('Reviewed patch already applied; verifying current source.')
          PY
      - name: Confirm clinical and print boundary
        run: git diff --exit-code 28ae520bb51161ef3eb4b3642071007601b9f64e -- public/legacy src/legacy src/domain src/application src/persistence src/documentation tests/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - name: Commit verified source on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts docs
          if ! git diff --cached --quiet; then
            git commit -m 'feat: rebuild standalone MA workstation with Lightfully shell'
            git push origin HEAD:codex/lightfully-standalone-rebuild
          fi
      - name: Package self-contained workstation
        run: GITHUB_SHA=$(git rev-parse HEAD) node scripts/package-standalone.mjs
      - name: Install exact Chromium renderer
        run: npx playwright install --with-deps chromium
      - name: Intentional screen rebaseline with unchanged clinical and layout assertions
        run: npx playwright test --update-snapshots
      - name: Commit reviewed screen baselines
        run: |
          git add tests/e2e
          if ! git diff --cached --quiet; then
            git commit -m 'test: baseline Lightfully screens after complete browser suite'
            git push origin HEAD:codex/lightfully-standalone-rebuild
          fi
      - name: Reproduce browser and print results without rebaseline
        run: npx playwright test
      - name: Verify native single-file startup and persistence
        run: TEST_STANDALONE_FILE=1 npx playwright test tests/e2e/standalone-file.spec.js
      - name: Archive exact source
        if: always()
        run: git archive --format=zip --output=lightfully-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightfully-rebuild-review
          path: |
            dist/
            standalone/
            playwright-report/
            test-results/
            lightfully-source.zip
          retention-days: 7
          if-no-files-found: warn
