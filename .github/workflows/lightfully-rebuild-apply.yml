name: Standalone shell acceptance
on:
  push:
    branches: [codex/lightfully-standalone-rebuild]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lightfully-rebuild-acceptance
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/lightfully-standalone-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patient-context and presentation parity fixes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          patch=lzma.decompress(base64.b64decode(pathlib.Path('.github/lightfully-polish.part').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='2ea43b5a7f938e202469c06ee541b60315a1d9aa7fc54427141ddcf7a6819131'
          p=pathlib.Path('/tmp/lightfully-polish.patch'); p.write_bytes(patch)
          check=subprocess.run(['git','apply','--check',str(p)],capture_output=True)
          if check.returncode==0: subprocess.run(['git','apply',str(p)],check=True)
          else: subprocess.run(['git','apply','--reverse','--check',str(p)],check=True)
          PY
      - name: Confirm clinical and print boundary
        run: git diff --exit-code 28ae520bb51161ef3eb4b3642071007601b9f64e -- public/legacy src/legacy src/domain src/application src/persistence src/documentation tests/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record dependency audit without silently changing the baseline
        run: npm audit --json > dependency-audit.json || true
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - name: Commit validated source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'fix: retain dashboard patient context and align screen contracts'
            git push origin HEAD:codex/lightfully-standalone-rebuild
          fi
      - name: Package self-contained workstation
        run: GITHUB_SHA=$(git rev-parse HEAD) node scripts/package-standalone.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Recheck affected screen expectations and patient-context safeguards
        run: npx playwright test tests/e2e/conventions.spec.js:153 tests/e2e/conventions.spec.js:815 tests/e2e/conventions.spec.js:934 tests/e2e/workstation.spec.js:661 tests/e2e/workstation.spec.js:805 tests/e2e/workstation.spec.js:1010 tests/e2e/workstation.spec.js:1624 tests/e2e/workstation.spec.js:3231 tests/e2e/visual-contracts.spec.js tests/e2e/tebra-screen-contract.spec.js --update-snapshots --max-failures=2
      - name: Full browser suite and intentional screen rebaseline
        id: screens
        continue-on-error: true
        run: npx playwright test --update-snapshots
      - name: Preserve first browser report
        if: always()
        run: |
          test ! -d playwright-report || cp -R playwright-report browser-report
          test ! -d test-results || cp -R test-results browser-results
      - name: Verify native single-file startup and persistence
        id: native
        continue-on-error: true
        run: TEST_STANDALONE_FILE=1 npx playwright test tests/e2e/standalone-file.spec.js
      - name: Commit screen baselines only after passing behavioral checks
        if: steps.screens.outcome == 'success'
        run: |
          git add tests/e2e
          if ! git diff --cached --quiet; then
            git commit -m 'test: baseline Lightfully screens after full browser regression'
            git push origin HEAD:codex/lightfully-standalone-rebuild
          fi
      - name: Reproduce browser and print results without rebaseline
        if: steps.screens.outcome == 'success'
        run: npx playwright test
      - name: Archive exact source
        if: always()
        run: git archive --format=zip --output=lightfully-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightfully-acceptance-review
          path: |
            dist/
            standalone/
            browser-report/
            browser-results/
            playwright-report/
            test-results/
            tests/e2e/*-snapshots/
            lightfully-source.zip
            dependency-audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce behavioral and native results
        if: always()
        run: |
          test '${{ steps.screens.outcome }}' = 'success'
          test '${{ steps.native.outcome }}' = 'success'
