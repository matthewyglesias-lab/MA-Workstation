name: Lightfully component checkpoint and acceptance
on:
  push:
    branches: [codex/lightfully-standalone-rebuild]
    paths: ['.github/polish-transfer/**', '.github/workflows/apply-component-polish.yml']
permissions:
  contents: write
concurrency:
  group: lightfully-component-polish
  cancel-in-progress: false
jobs:
  checkpoint-and-verify:
    if: github.ref == 'refs/heads/codex/lightfully-standalone-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed presentation changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          h=lambda b: hashlib.sha256(b).hexdigest()
          parts=sorted(Path('.github/polish-transfer').glob('*.part'))
          assert len(parts)==2
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert h(raw)=='e2f331d8944a7a3c861da13887ac7c6d1e21123a234b2cd49cb2abade476f3d7'
          pending={}
          for change in json.loads(raw):
              name=change['path']; pp=PurePosixPath(name)
              assert not pp.is_absolute() and '..' not in pp.parts
              assert name.startswith(('src/presentation/','tests/e2e/','docs/lightfully/'))
              p=Path(name); old=p.read_bytes() if p.exists() else b''
              assert h(old)==change['old'] if change['old'] is not None else not p.exists()
              lines=old.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(change['ops']): lines[start:end]=replacement
              new=''.join(lines).encode(); assert h(new)==change['new']
              assert name not in pending
              pending[name]=new
          for name,new in pending.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          print('Applied',len(pending),'hash-verified presentation/test files.')
          PY
      - name: Verify original clinical, persistence, documentation and print boundary
        run: git diff --exit-code 28ae520bb51161ef3eb4b3642071007601b9f64e -- public/legacy src/legacy src/domain src/application src/persistence src/documentation tests/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record inherited dependency audit
        run: npm audit --json > dependency-audit.json || true
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - name: Save source checkpoint before the long browser suite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/polish-transfer .github/workflows/apply-component-polish.yml
          git add src/presentation tests/e2e docs/lightfully
          git commit -m 'feat: unify Lightfully entry, guidance, choices and service actions'
          git push origin HEAD:codex/lightfully-standalone-rebuild
          git archive --format=zip --output=polished-source-checkpoint.zip HEAD
      - run: GITHUB_SHA=$(git rev-parse HEAD) node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Full browser and unchanged clinical/print assertions with reviewed new appearance
        run: npx playwright test --update-snapshots
      - name: Native standalone startup and saved-draft reload
        run: TEST_STANDALONE_FILE=1 npx playwright test tests/e2e/standalone-file.spec.js --output=native-polish-results --reporter=list
      - name: Save validated screen baselines
        run: |
          git add tests/e2e
          if ! git diff --cached --quiet; then
            git commit -m 'test: accept consistent Lightfully screens after complete regression'
            git push origin HEAD:codex/lightfully-standalone-rebuild
          fi
      - name: Package exact verified revision
        run: |
          GITHUB_SHA=$(git rev-parse HEAD) node scripts/package-standalone.mjs
          git archive --format=zip --output=polished-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightfully-polish-acceptance
          path: |
            standalone/
            polished-source.zip
            polished-source-checkpoint.zip
            playwright-report/
            test-results/
            native-polish-results/
            dependency-audit.json
          retention-days: 7
          if-no-files-found: warn
