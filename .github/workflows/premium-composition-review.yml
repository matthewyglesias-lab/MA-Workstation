name: Premium composition review
on:
  push:
    branches: [codex/premium-workstation-composition]
    paths: [.github/workflows/premium-composition-review.yml]
permissions:
  contents: read
concurrency:
  group: premium-composition-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/premium-workstation-composition
          fetch-depth: 0
      - name: Apply exact reviewed edits, never modify a changed preimage
        run: |
          test "$GITHUB_REF" = refs/heads/codex/premium-workstation-composition
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = [pathlib.Path('.review-transport/composition-01.b64'), pathlib.Path('.review-transport/composition-02.b64')]
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '5a2952b563c12bcb47d8899fc9fa6a20db76fa02c6cfdcb32a79a2c75088f7bb', 'Transport digest mismatch'
          changes = json.loads(raw)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
          already_applied = all(digest(pathlib.Path(c['p'])) == c['a'] for c in changes)
          if not already_applied:
              prepared = []
              for c in changes:
                  path = pathlib.Path(c['p'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert c['p'].startswith(('src/presentation/', 'tests/')), 'Unexpected change scope'
                  assert digest(path) == c['b'], 'Concurrent change: ' + c['p']
                  lines = path.read_text().splitlines(keepends=True) if path.exists() else []
                  for i,j,text in reversed(c['e']): lines[i:j] = [text]
                  result = ''.join(lines).encode()
                  assert c['a'] is None or hashlib.sha256(result).hexdigest() == c['a'], 'Postimage mismatch: ' + c['p']
                  prepared.append((path, result, c['a']))
              for path, result, after in prepared:
                  if after is None: path.unlink()
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(result)
              subprocess.run(['git','add','-A','--',*[c['p'] for c in changes]],check=True)
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','refactor: coherent clinical composition and single popover event owner'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/codex/premium-workstation-composition'],check=True)
          pathlib.Path('review-evidence').mkdir(exist_ok=True)
          pathlib.Path('review-evidence/COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          pathlib.Path('review-evidence/TREE.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD^{tree}']))
          pathlib.Path('review-evidence/changed-files.json').write_text(json.dumps([{k:c[k] for k in ['p','b','a']} for c in changes],indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Actual composition, input and event-ownership journeys
        run: npx playwright test tests/e2e/premium-composition.spec.js tests/e2e/control-details.spec.js tests/e2e/clinic-composition.spec.js --retries=0 --reporter=line,json,html
      - name: Archive exact tested source
        if: always()
        run: git archive HEAD | gzip > review-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-composition-review
          path: |
            review-evidence/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
