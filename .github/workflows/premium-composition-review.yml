name: Premium composition final candidate review
on:
  push:
    branches: [codex/premium-workstation-composition]
    paths: [.github/workflows/premium-composition-review.yml]
permissions:
  contents: read
concurrency:
  group: premium-composition-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
      TEST_STANDALONE_FILE: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply verified ownership corrections and remove temporary review machinery
        run: |
          test "$GITHUB_REF" = refs/heads/codex/premium-workstation-composition
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(pathlib.Path('.review-transport/revision-05.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '3d5f843b8835a71034efca0603acbd86b9d9a7aee3ba57e20f89c5a5561de86f', 'Transport digest mismatch'
          changes = json.loads(raw)
          prepared = []
          for c in changes:
              path = pathlib.Path(c['p'])
              assert not path.is_absolute() and '..' not in path.parts
              assert c['p'].startswith(('src/presentation/', 'tests/', 'docs/premium-composition/')), 'Unexpected scope'
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == c['b'], 'Changed preimage: ' + c['p']
              lines = (before or b'').decode().splitlines(keepends=True)
              for i,j,text in reversed(c['e']): lines[i:j] = [text]
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == c['a'], 'Postimage mismatch: ' + c['p']
              prepared.append((path, result))
          for path, result in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          expected = {'composition-01.b64','composition-02.b64','revision-02.b64','revision-03.b64','revision-04.b64','revision-05.b64'}
          transports = list(pathlib.Path('.review-transport').iterdir())
          assert {p.name for p in transports} == expected, 'Unexpected transport contents'
          for path in transports: path.unlink()
          pathlib.Path('.review-transport').rmdir()
          for name in ['premium-review-environment.yml','premium-composition-review.yml']:
              pathlib.Path('.github/workflows', name).unlink()
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix: isolate signed outcome, complete single-owner cleanup and remove review transports'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/premium-workstation-composition'],check=True)
          pathlib.Path('review-evidence').mkdir(exist_ok=True)
          pathlib.Path('review-evidence/SOURCE_COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Corrected complete journeys
        id: journeys
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/focused.json
        run: npx playwright test --grep 'one coherent shell|popover listeners|save and lookup|legacy and shell|returns from patient browsing|moves a synthetic note|soft-syncs' --retries=0 --reporter=line,json,html
      - name: Preserve focused journey evidence
        if: always()
        run: cp -r test-results review-evidence/focused-captures 2>/dev/null || true
      - name: Generate candidate screen references without changing tolerances
        id: candidates
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/visual-candidates.json
        run: npx playwright test tests/e2e/visual-snapshots.spec.js tests/e2e/lightfully-shell.spec.js --update-snapshots --retries=0 --reporter=line,json,html
      - name: Full regression review without updating references
        id: full
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/full.json
        run: npx playwright test --retries=0 --reporter=line,json,html
      - name: Record candidate images only after all complete journeys pass
        if: steps.journeys.outcome == 'success' && steps.candidates.outcome == 'success' && steps.full.outcome == 'success'
        run: |
          git add tests/e2e/visual-snapshots.spec.js-snapshots/ tests/e2e/lightfully-shell.spec.js-snapshots/
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all('/linux/' in p and p.endswith('.png') and p.startswith('tests/e2e/') for p in paths), 'Unexpected staged change'
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'test: capture passing premium composition image candidates for inspection'
            git push origin HEAD:refs/heads/codex/premium-workstation-composition
          fi
      - name: Archive exact source and capture identity
        if: always()
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/COMMIT.txt
          git rev-parse HEAD^{tree} > review-evidence/TREE.txt
          git archive HEAD | gzip > review-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-composition-final-candidate
          path: |
            review-evidence/
            test-results/
            playwright-report/
            tests/e2e/visual-snapshots.spec.js-snapshots/linux/
            tests/e2e/lightfully-shell.spec.js-snapshots/linux/
          retention-days: 7
          if-no-files-found: error
      - name: Require all complete journey reviews
        if: always()
        run: test '${{ steps.journeys.outcome }}' = success && test '${{ steps.candidates.outcome }}' = success && test '${{ steps.full.outcome }}' = success
