name: Premium composition review
on:
  push:
    branches: [codex/premium-workstation-composition]
    paths: [.github/workflows/premium-composition-review.yml]
permissions:
  contents: read
concurrency:
  group: premium-composition-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
      TEST_STANDALONE_FILE: '1'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/premium-workstation-composition
          fetch-depth: 0
      - name: Apply exact reviewed edits, never modify a changed preimage
        run: |
          test "$GITHUB_REF" = refs/heads/codex/premium-workstation-composition
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(pathlib.Path('.review-transport/revision-04.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '04fbf6de3ae9b0755b768e5da0821e84ac790b12a102cfb0d58d3363f99365c7', 'Transport digest mismatch'
          changes = json.loads(raw)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
          if not all(digest(pathlib.Path(c['p'])) == c['a'] for c in changes):
              prepared = []
              for c in changes:
                  path = pathlib.Path(c['p'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert c['p'].startswith(('src/presentation/', 'tests/')), 'Unexpected change scope'
                  assert digest(path) == c['b'], 'Concurrent change: ' + c['p']
                  lines = path.read_text().splitlines(keepends=True) if path.exists() else []
                  for i,j,text in reversed(c['e']): lines[i:j] = [text]
                  result = ''.join(lines).encode()
                  assert c['a'] is None or hashlib.sha256(result).hexdigest() == c['a'], 'Postimage mismatch: ' + c['p']
                  prepared.append((path, result, c['a']))
              for path, result, after in prepared:
                  if after is None: path.unlink()
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(result)
              subprocess.run(['git','add','-A','--',*[c['p'] for c in changes]],check=True)
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','refactor: finish single-owner utility styling and verify guarded patient context'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/codex/premium-workstation-composition'],check=True)
          pathlib.Path('review-evidence').mkdir(exist_ok=True)
          pathlib.Path('review-evidence/SOURCE_COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/package-standalone.mjs
      - run: npx playwright install --with-deps chromium
      - name: Corrected complete journeys
        id: journeys
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/focused.json
        run: npx playwright test --grep 'one coherent shell|popover listeners|save and lookup|legacy and shell|focused injection keeps|editorial masthead|entry and preview|returns from patient browsing|quiet everyday controls' --retries=0 --reporter=line,json,html
      - name: Preserve focused journey evidence
        if: always()
        run: cp -r test-results review-evidence/focused-captures 2>/dev/null || true
      - name: Generate candidate screen references without changing tolerances
        id: candidates
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/visual-candidates.json
        run: npx playwright test tests/e2e/visual-snapshots.spec.js tests/e2e/lightfully-shell.spec.js --update-snapshots --retries=0 --reporter=line,json,html
      - name: Full regression review without updating references
        id: full
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-evidence/full.json
        run: npx playwright test --retries=0 --reporter=line,json,html
      - name: Commit candidate references only after all journeys pass
        if: steps.journeys.outcome == 'success' && steps.candidates.outcome == 'success' && steps.full.outcome == 'success'
        run: |
          git add tests/e2e/visual-snapshots.spec.js-snapshots/ tests/e2e/lightfully-shell.spec.js-snapshots/
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all('/linux/' in p and p.endswith('.png') and p.startswith('tests/e2e/') for p in paths), 'Unexpected staged change'
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: capture candidate Linux composition references for visual review'
            git push origin HEAD:refs/heads/codex/premium-workstation-composition
          fi
      - name: Archive exact source and capture identity
        if: always()
        run: |
          git rev-parse HEAD > review-evidence/COMMIT.txt
          git rev-parse HEAD^{tree} > review-evidence/TREE.txt
          git archive HEAD | gzip > review-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-composition-review
          path: |
            review-evidence/
            test-results/
            playwright-report/
            tests/e2e/visual-snapshots.spec.js-snapshots/linux/
            tests/e2e/lightfully-shell.spec.js-snapshots/linux/
          retention-days: 7
          if-no-files-found: error
      - name: Require all complete journey reviews
        if: always()
        run: test '${{ steps.journeys.outcome }}' = success && test '${{ steps.candidates.outcome }}' = success && test '${{ steps.full.outcome }}' = success
