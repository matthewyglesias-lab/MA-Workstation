name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  static_checks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Type, static, unit, and production build
    env:
      # Clinic-approved patient screening is part of every production and PR
      # artifact. An explicit false remains available as an operational kill
      # switch, but the release workflow validates the live default.
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run static compatibility checks
        run: npm run check:static
      - name: Run unit tests
        run: npm run test:unit
      - name: Build production bundle
        run: npm run build
      - name: Verify deployment bundle
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/legacy/legacy-runtime.js
          test -f dist/legacy/legacy.css
      - name: Upload tested production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser_and_print_e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    needs: static_checks
    runs-on: ubuntu-latest
    name: Test the exact production artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the production bundle
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Verify downloaded bundle
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/legacy/legacy-runtime.js
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser, visual, and print end-to-end tests
        run: npm run test:e2e:artifact
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build_and_deploy_job:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main')
    needs: [static_checks, browser_and_print_e2e]
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install smoke-test dependencies
        run: npm ci
      - name: Install Chromium for deployed-app smoke test
        run: npx playwright install --with-deps chromium
      - name: Download tested production bundle
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Deploy static app
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
      - name: Smoke deployed workstation
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PRODUCTION_FALLBACK_URL: https://white-grass-07a8c0910.7.azurestaticapps.net/
          IS_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/smoke-deployment.mjs
      - name: Smoke deployed workstation in Chromium
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PRODUCTION_FALLBACK_URL: https://white-grass-07a8c0910.7.azurestaticapps.net/
          IS_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm run smoke:browser

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close pull request preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
