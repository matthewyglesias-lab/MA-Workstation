name: Lightfully standalone review

on:
  push:
    branches: [codex/lightfully-standalone-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightfully-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source commit
        run: git archive --format=zip --output=standalone-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-review-source
          path: standalone-review-source.zip
          retention-days: 3
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lightfully-standalone-static
          path: dist/
          retention-days: 7
          if-no-files-found: error
