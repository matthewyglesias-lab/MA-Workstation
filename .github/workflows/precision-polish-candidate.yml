name: Verify precision polish candidate
on:
  push:
    branches: [codex/ipmg-local-workstation-refinement]
    paths: [.github/workflows/precision-polish-candidate.yml]
# Exact, single-use source transport. No release, production deployment or merge.
permissions:
  contents: write
jobs:
  reviewed-candidate:
    if: github.repository == 'matthewyglesias-lab/MA-Workstation' && github.ref == 'refs/heads/codex/ipmg-local-workstation-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_ENABLE_INJECTION_PATIENT_SCREENING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact parent, reviewed patch and source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a662fe777628ab9e4f2cca7498da9e573ead2264
          cat .github/review/precision-{1,2}.txt | base64 --decode | gzip --decompress > "$RUNNER_TEMP/precision.patch"
          echo "b417ba5be14735f1e4e93e06cef8233d7fe639864f14de972fc8136b488d0ea5  $RUNNER_TEMP/precision.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/precision.patch"
          git apply --index "$RUNNER_TEMP/precision.patch"
          git rm .github/workflows/precision-polish-candidate.yml .github/review/precision-{1,2}.txt
          test "$(git write-tree)" = a267ce4cf114b55559a8d777adef81f4ad8ba3f2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: polish Lightfully geometry and optimize read-only record views' -m 'Align field baselines, joined controls, dialogs and typography. Batch accessible labels in linear time, bound snapshot-local search caches, memoize display projections and preserve patient search composition/focus. Keep clinical, persistence, notes, print and AVS behavior intact. Draft PR #68 only; no deployment or merge.'
          mkdir -p review-proof review-source
          git rev-parse HEAD > review-proof/COMMIT.txt
          git rev-parse HEAD^{tree} > review-proof/TREE.txt
          git archive --format=tar HEAD | gzip > review-source/source.tar.gz
          git bundle create review-source/review.bundle HEAD ^59551bc914b945f268710fca3ef44c2e9ca62c50
          cp review-proof/{COMMIT,TREE}.txt review-source/
      - uses: actions/upload-artifact@v4
        with:
          name: precision-candidate-source
          path: review-source/
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve clinical, persistence and print boundaries
        run: node scripts/check-local-refinement.mjs
      - run: npm run check
      - name: Unit regression and synthetic label benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit | tee review-proof/unit-results.txt
      - run: npm run build
      - name: Package exact candidate
        run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/package-standalone.mjs
      - run: npx playwright install chromium
      - name: Targeted geometry, record integrity and local-file verification
        env:
          TEST_STANDALONE_FILE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: review-proof/browser-results.json
        run: >-
          npx playwright test
          tests/e2e/precision-polish.spec.js
          tests/e2e/calm-workspace.spec.js
          tests/e2e/deep-refinement.spec.js
          tests/e2e/lightfully-direction.spec.js
          tests/e2e/local-refinement.spec.js
          tests/e2e/contemporary-workspace.spec.js
          tests/e2e/injection-full-draft-safety.spec.js
          tests/e2e/uds-record-integrity.spec.js
          tests/e2e/print-regression.spec.js
          tests/e2e/standalone-file.spec.js
          tests/e2e/kiosk-flow.spec.js
          --reporter=line,json,html
      - uses: actions/upload-artifact@v4
        with:
          name: precision-polish-standalone
          path: standalone/
          retention-days: 7
          if-no-files-found: error
      - name: Publish exact verified source to draft branch only
        run: |
          test "$(git ls-remote origin refs/heads/codex/ipmg-local-workstation-refinement | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/ipmg-local-workstation-refinement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-polish-targeted-evidence
          path: |
            review-proof/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Complete original regression suite (diagnostic, no snapshots replaced)
        id: full_suite
        continue-on-error: true
        env:
          TEST_STANDALONE_FILE: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: full-proof/browser-results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: full-report
        run: |
          mkdir -p full-proof
          cp review-proof/{COMMIT,TREE}.txt full-proof/
          npx playwright test --output=full-test-results --reporter=line,json,html
      - name: Record full-suite outcome independently of targeted checks
        if: always()
        run: |
          mkdir -p full-proof
          echo '${{ steps.full_suite.outcome }}' > full-proof/OUTCOME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-polish-full-suite-diagnostic
          path: |
            full-proof/
            full-report/
            full-test-results/
          retention-days: 7
          if-no-files-found: warn
