<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IPMG Medical Assistant Workstation for fast clinical documentation."
    />
    <title>IPMG MA Workstation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Print-only. This file is not really a stylesheet - it is a scraped HTML
      document (with <html>/<head>/<title> and several <style> blocks) renamed
      to .css, carrying the entire pre-redesign design system: the periwinkle
      brand accent (--lav:#6B5CA5), 16px radii, pill shapes, diffuse shadows,
      and an Inter/Plus Jakarta Sans type stack. Loading it on screen made it
      the base layer of the cascade on every page, which is why the redesign
      needed ~900 !important declarations to fight it.

      The 8 print sheets (.beauty-*) are styled EXCLUSIVELY here, so the file
      still has to load for print - but only for print. media="print" keeps
      print output byte-identical while giving the screen a clean cascade.
      Do not edit public/legacy/legacy.css; print parity depends on it.
    -->
    <link rel="stylesheet" href="/legacy/legacy.css" media="print" />
    <!--
      Inline and dependency-free on purpose: this has to paint before Vite's
      module graph (main.tsx and everything it imports, including the
      presentation layer's own CSS) has loaded and run. boot() in main.tsx
      removes #boot-splash once the real shell has rendered, or on a boot
      failure.

      Values are literal, not var(--tw-*), because tebra-tokens.css is not yet
      available. The system type stack is intentional for the same reason.
      Keep this geometry in step with the shell so loading never flashes the
      wrong application shape.
    -->
    <style media="screen">
      #boot-splash {position:fixed;inset:0;z-index:9999;display:grid;grid-template-columns:190px 1fr;grid-template-rows:64px 1fr 30px;color:#294255;background:#fbfcfc;font:12px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity 160ms linear;}
      #boot-splash * {box-sizing:border-box;}
      #boot-splash.is-done {opacity:0;pointer-events:none;}
      #boot-splash .boot-rail {grid-row:1/-1;padding:26px 19px;background:#f6f4f7;border-right:1px solid #dee5e9;}
      #boot-splash .boot-brand-name {display:block;font-size:14px;font-weight:700;letter-spacing:1px;}
      #boot-splash .boot-brand-note {display:block;font-size:11px;color:#607584;}
      #boot-splash .boot-new {height:41px;background:#f37565;border-radius:7px;margin:30px -7px 24px;}
      #boot-splash .boot-nav {height:36px;background:#e5eef2;border-radius:7px;margin:8px -7px;}
      #boot-splash .boot-header {grid-column:2;display:flex;align-items:center;padding:0 26px;background:#fff;border-bottom:1px solid #dee5e9;}
      #boot-splash .boot-search {width:min(440px,75%);height:36px;background:#f6f8f9;border:1px solid #dee5e9;border-radius:7px;}
      #boot-splash .boot-main {grid-column:2;padding:30px;}
      #boot-splash h1 {font:400 32px/1.3 Georgia,serif;margin:0 0 12px;}
      #boot-splash p {color:#607584;}
      #boot-splash .boot-footer {grid-column:2;padding:4px 22px;background:#fff;border-top:1px solid #dee5e9;color:#607584;font-size:10px;text-align:right;}
      @media(max-width:949px){#boot-splash{grid-template-columns:160px 1fr;grid-template-rows:56px 1fr 30px;}}
      @media(prefers-reduced-motion:reduce){#boot-splash{transition:none;}}
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Starting the workstation. Records stay in this browser.">
      <aside class="boot-rail" aria-hidden="true"><span class="boot-brand-name">IPMG</span><span class="boot-brand-note">MA Workstation</span><div class="boot-new"></div><div class="boot-nav"></div></aside>
      <header class="boot-header" aria-hidden="true"><div class="boot-search"></div></header>
      <main class="boot-main"><h1>MA Workstation</h1><p>Opening your workspace…</p></main>
      <div class="boot-footer">Records stay in this browser</div>
    </div>
    <div id="app"></div>
    <div id="legacy-staging" aria-hidden="true"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
