<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IPMG Medical Assistant Workstation for fast clinical documentation."
    />
    <title>IPMG MA Workstation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Print-only. This file is not really a stylesheet - it is a scraped HTML
      document (with <html>/<head>/<title> and several <style> blocks) renamed
      to .css, carrying the entire pre-redesign design system: the periwinkle
      brand accent (--lav:#6B5CA5), 16px radii, pill shapes, diffuse shadows,
      and an Inter/Plus Jakarta Sans type stack. Loading it on screen made it
      the base layer of the cascade on every page, which is why the redesign
      needed ~900 !important declarations to fight it.

      The 8 print sheets (.beauty-*) are styled EXCLUSIVELY here, so the file
      still has to load for print - but only for print. media="print" keeps
      print output byte-identical while giving the screen a clean cascade.
      Do not edit public/legacy/legacy.css; print parity depends on it.
    -->
    <link rel="stylesheet" href="/legacy/legacy.css" media="print" />
    <!--
      Inline and dependency-free on purpose: this has to paint before Vite's
      module graph (main.tsx and everything it imports, including the
      presentation layer's own CSS) has loaded and run. boot() in main.tsx
      removes #boot-splash once the real shell has rendered, or on a boot
      failure.

      Values are literal, not var(--tw-*), because tebra-tokens.css is not yet
      available. The system type stack is intentional for the same reason.
      Keep this geometry in step with the shell so loading never flashes the
      wrong application shape.
    -->
    <style media="screen">
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 65px 64px minmax(0, 1fr) 38px 32px;
        min-width: 320px;
        overflow: hidden;
        color: #003a43;
        background: #fbf9f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        transition: opacity 160ms linear;
      }
      #boot-splash,
      #boot-splash *,
      #boot-splash *::before,
      #boot-splash *::after {
        box-sizing: border-box;
      }
      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-header {
        display: grid;
        grid-template-columns: 184px minmax(220px, 420px) minmax(180px, 1fr);
        align-items: center;
        gap: 24px;
        padding: 0 20px;
        color: #f8f3eb;
        background: #004852;
        border-bottom: 0;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      #boot-splash .boot-brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        color: #f8f3eb;
        background: rgb(255 255 255 / 10%);
        border: 1px solid rgb(255 255 255 / 24%);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #boot-splash .boot-brand-name {
        overflow: hidden;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #boot-splash .boot-search {
        height: 38px;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 24px;
        background: #002328;
      }
      #boot-splash .boot-header-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      #boot-splash .boot-header-action {
        width: 72px;
        height: 38px;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 24px;
        background: rgb(255 255 255 / 10%);
      }
      #boot-splash .boot-header-action:last-child {
        width: 92px;
      }
      #boot-splash .boot-patient {
        display: grid;
        grid-template-columns:
          minmax(190px, 1.35fr) minmax(82px, 0.55fr) minmax(110px, 0.7fr)
          minmax(116px, 0.78fr) minmax(116px, 0.78fr)
          minmax(240px, 1.55fr);
        min-width: 0;
        background: #fcf9f5;
        border-bottom: 1px solid #d2dcda;
      }
      #boot-splash .boot-patient-block {
        display: grid;
        align-content: center;
        gap: 7px;
        min-width: 0;
        padding: 9px 12px;
        border-right: 1px solid #e7ded2;
      }
      #boot-splash .boot-patient-block:first-child {
        background: #f8f3eb;
      }
      #boot-splash .boot-patient-block:last-child {
        border-right: 0;
      }
      #boot-splash .boot-patient-block::before,
      #boot-splash .boot-patient-block::after {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: #d2dcda;
        content: "";
      }
      #boot-splash .boot-patient-block::before {
        width: 42%;
        height: 7px;
      }
      #boot-splash .boot-patient-block::after {
        width: 74%;
      }
      #boot-splash .boot-workspace {
        display: grid;
        grid-template-columns: 192px minmax(0, 1fr);
        min-height: 0;
      }
      #boot-splash .boot-rail {
        padding: 16px 0;
        background: #ffffff;
        border-right: 1px solid #d2dcda;
      }
      #boot-splash .boot-rail-title {
        width: 68px;
        height: 10px;
        margin: 0 16px 14px;
        border-radius: 4px;
        background: #d2dcda;
      }
      #boot-splash .boot-rail-item {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        margin-bottom: 0;
        padding: 0 16px;
        border-radius: 0;
      }
      #boot-splash .boot-rail-item:first-of-type {
        background: #ebf0ef;
      }
      #boot-splash .boot-rail-icon {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        border-radius: 4px;
        background: #c5d6d7;
      }
      #boot-splash .boot-rail-line {
        width: 96px;
        height: 9px;
        border-radius: 4px;
        background: #d2dcda;
      }
      #boot-splash .boot-main {
        min-width: 0;
        overflow: hidden;
        padding: 32px;
      }
      #boot-splash .boot-page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 40px;
        margin-bottom: 18px;
      }
      #boot-splash .boot-page-heading h1 {
        margin: 0;
        font-size: 32px;
        line-height: 40px;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-page-actions {
        display: flex;
        gap: 8px;
      }
      #boot-splash .boot-page-action {
        width: 78px;
        height: 38px;
        border: 1px solid #b3c6c4;
        border-radius: 24px;
        background: #ffffff;
      }
      #boot-splash .boot-page-action:first-child {
        width: 108px;
        background: #ff8d6e;
        border-color: #ff8d6e;
      }
      #boot-splash .boot-table {
        overflow: hidden;
        min-height: 248px;
        background: #ffffff;
        border: 0;
        border-radius: 4px;
        box-shadow:
          0 2px 1px -1px rgb(0 0 0 / 20%),
          0 1px 1px 0 rgb(0 0 0 / 14%),
          0 1px 3px 0 rgb(0 0 0 / 12%);
      }
      #boot-splash .boot-table-head,
      #boot-splash .boot-table-row {
        display: grid;
        grid-template-columns: minmax(120px, 2fr) 40px minmax(80px, 1fr)
          minmax(92px, 1fr) minmax(100px, 1fr);
        align-items: center;
        gap: 16px;
        padding: 0 18px;
      }
      #boot-splash .boot-table-head {
        height: 48px;
        color: #1f5f67;
        background: #ffffff;
        border-bottom: 1px solid #d2dcda;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #boot-splash .boot-table-row {
        height: 54px;
        border-bottom: 1px solid #ebf0ef;
      }
      #boot-splash .boot-table-row:last-child {
        border-bottom: 0;
      }
      #boot-splash .boot-cell {
        width: 72%;
        height: 10px;
        border-radius: 4px;
        background: #ebf0ef;
      }
      #boot-splash .boot-cell.is-short {
        width: 44%;
      }
      #boot-splash .boot-shortcuts {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 4px 12px;
        background: #fcf9f5;
        border-top: 1px solid #d2dcda;
      }
      #boot-splash .boot-shortcuts::after {
        width: 132px;
        height: 29px;
        border: 1px solid #d2dcda;
        border-radius: 8px;
        background: #ffffff;
        content: "";
      }
      /* Static by default: loading feedback has no shimmer or motion. */
      #boot-splash .boot-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 20px;
        color: #1f5f67;
        background: #ffffff;
        border-top: 1px solid #d2dcda;
        font-size: 12px;
        font-weight: 600;
      }
      #boot-splash .boot-footer::before {
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 999px;
        background: #1f6f5c;
        content: "";
      }
      @media (min-width: 800px) and (max-width: 919px) {
        #boot-splash {
          grid-template-rows: 56px 58px minmax(0, 1fr) 38px 32px;
        }
        #boot-splash .boot-workspace {
          grid-template-columns: 166px minmax(0, 1fr);
        }
        #boot-splash .boot-main {
          padding: 8px;
        }
        #boot-splash .boot-page-heading h1 {
          font-size: 21px;
          line-height: 28px;
          letter-spacing: -0.01em;
        }
      }
      @media (min-width: 800px) and (max-width: 839px) and (min-height: 600px) {
        #boot-splash {
          grid-template-rows: 54px 54px minmax(0, 1fr) 34px 29px;
        }
        #boot-splash .boot-workspace {
          grid-template-columns: 158px minmax(0, 1fr);
        }
        #boot-splash .boot-rail {
          padding: 4px 0;
        }
        #boot-splash .boot-rail-title {
          margin: 0 8px 7px;
        }
        #boot-splash .boot-rail-item {
          height: 31px;
          padding: 0 8px;
        }
        #boot-splash .boot-main {
          padding: 6px;
        }
        #boot-splash .boot-shortcuts {
          padding-block: 2px;
        }
        #boot-splash .boot-shortcuts::after {
          height: 28px;
        }
      }
      @media (max-height: 700px) and (min-width: 800px) {
        #boot-splash .boot-rail-item {
          height: 31px;
        }
      }
      @media (max-width: 799px) {
        #boot-splash {
          grid-template-rows: 56px 54px minmax(0, 1fr) 34px 29px;
        }
        #boot-splash .boot-header {
          grid-template-columns: minmax(160px, 1fr) minmax(180px, 2fr);
        }
        #boot-splash .boot-header-actions {
          display: none;
        }
        #boot-splash .boot-workspace {
          grid-template-columns: 64px minmax(0, 1fr);
        }
        #boot-splash .boot-patient-block:nth-child(n + 4) {
          display: none;
        }
        #boot-splash .boot-patient {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        #boot-splash .boot-rail {
          padding-inline: 10px;
        }
        #boot-splash .boot-rail-title,
        #boot-splash .boot-rail-line {
          display: none;
        }
        #boot-splash .boot-rail-item {
          justify-content: center;
          padding: 0;
        }
        #boot-splash .boot-page-actions {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="boot-splash"
      role="status"
      aria-label="Starting the workstation. Records stay in this browser."
    >
      <header class="boot-header" aria-hidden="true">
        <div class="boot-brand">
          <span class="boot-brand-mark">IPMG</span>
          <span class="boot-brand-name">MA Workstation</span>
        </div>
        <div class="boot-search"></div>
        <div class="boot-header-actions">
          <span class="boot-header-action"></span>
          <span class="boot-header-action"></span>
          <span class="boot-header-action"></span>
        </div>
      </header>
      <div class="boot-patient" aria-hidden="true">
        <span class="boot-patient-block"></span>
        <span class="boot-patient-block"></span>
        <span class="boot-patient-block"></span>
        <span class="boot-patient-block"></span>
        <span class="boot-patient-block"></span>
        <span class="boot-patient-block"></span>
      </div>
      <div class="boot-workspace" aria-hidden="true">
        <aside class="boot-rail">
          <div class="boot-rail-title"></div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
          <div class="boot-rail-item">
            <span class="boot-rail-icon"></span>
            <span class="boot-rail-line"></span>
          </div>
        </aside>
        <main class="boot-main">
          <div class="boot-page-heading">
            <h1>Open Notes</h1>
            <div class="boot-page-actions">
              <span class="boot-page-action"></span>
              <span class="boot-page-action"></span>
              <span class="boot-page-action"></span>
            </div>
          </div>
          <div class="boot-table">
            <div class="boot-table-head">
              <span>Patient</span>
              <span>Lock</span>
              <span>Type</span>
              <span>Status</span>
              <span>Visit date</span>
            </div>
            <div class="boot-table-row">
              <span class="boot-cell"></span>
              <span class="boot-cell is-short"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
            </div>
            <div class="boot-table-row">
              <span class="boot-cell"></span>
              <span class="boot-cell is-short"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
            </div>
            <div class="boot-table-row">
              <span class="boot-cell"></span>
              <span class="boot-cell is-short"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
            </div>
            <div class="boot-table-row">
              <span class="boot-cell"></span>
              <span class="boot-cell is-short"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
              <span class="boot-cell"></span>
            </div>
          </div>
        </main>
      </div>
      <div class="boot-shortcuts" aria-hidden="true"></div>
      <!-- The local-only disclosure is visible on the very first frame. -->
      <div class="boot-footer">Records stay in this browser</div>
    </div>
    <div id="app"></div>
    <div id="legacy-staging" aria-hidden="true"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
