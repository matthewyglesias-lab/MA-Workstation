<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IPMG Medical Assistant Workstation for fast clinical documentation."
    />
    <title>IPMG MA Workstation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Print-only. This file is not really a stylesheet - it is a scraped HTML
      document (with <html>/<head>/<title> and several <style> blocks) renamed
      to .css, carrying the entire pre-redesign design system: the periwinkle
      brand accent (--lav:#6B5CA5), 16px radii, pill shapes, diffuse shadows,
      and an Inter/Plus Jakarta Sans type stack. Loading it on screen made it
      the base layer of the cascade on every page, which is why the redesign
      needed ~900 !important declarations to fight it.

      The 8 print sheets (.beauty-*) are styled EXCLUSIVELY here, so the file
      still has to load for print - but only for print. media="print" keeps
      print output byte-identical while giving the screen a clean cascade.
      Do not edit public/legacy/legacy.css; print parity depends on it.
    -->
    <link rel="stylesheet" href="/legacy/legacy.css" media="print" />
    <!--
      Inline and dependency-free on purpose: this has to paint before Vite's
      module graph (main.tsx and everything it imports, including the
      presentation layer's own CSS) has loaded and run, or the very first
      thing staff would see is a blank white flash. boot() in main.tsx removes
      #boot-splash once the real shell has rendered, or on a boot failure.
    -->
    <!--
      Values are literal, not var(--tw-*): this block paints before the module
      graph (and therefore before tebra-tokens.css) has loaded. They are the
      same teal-900 / sand-150 the token layer defines. The typeface is a
      system stack for the same reason - @fontsource is imported by main.tsx
      and is not available this early, so asking for Inter here would only
      produce an invisible fallback.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: #003a43;
        color: #f8f3eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        transition: opacity 160ms linear;
      }
      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-mark {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #82a4a7;
      }
      #boot-splash .boot-sub {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-status {
        margin-top: 22px;
        font-size: 13px;
        color: #82a4a7;
      }
      /* A calm determinate-looking track rather than a hatched Win95 gauge:
         one sand indicator easing across a recessed teal rail. */
      #boot-splash .boot-bar {
        width: 168px;
        height: 3px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #054a53;
      }
      #boot-splash .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #f8f3eb;
        animation: boot-bar-sweep 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-bar-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* teal-300 on teal-900 clears 4.5:1; the darker teal-500 measured 2.2:1,
         which is not good enough for the line that tells staff where their
         documentation actually goes. */
      #boot-splash .boot-footer {
        position: absolute;
        bottom: 20px;
        font-size: 12px;
        color: #82a4a7;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Starting the workstation">
      <div class="boot-mark">IPMG</div>
      <div class="boot-sub">MA Workstation</div>
      <div class="boot-status">Starting&hellip;</div>
      <div class="boot-bar"></div>
      <!-- The local-only disclosure starts here, in plain language, on the
           very first surface staff see. It is not a warning banner. -->
      <div class="boot-footer">Records stay in this browser</div>
    </div>
    <div id="app"></div>
    <div id="legacy-staging" aria-hidden="true"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
