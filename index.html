<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IPMG Medical Assistant Workstation for fast clinical documentation."
    />
    <title>IPMG MA Workstation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Print-only. This file is not really a stylesheet - it is a scraped HTML
      document (with <html>/<head>/<title> and several <style> blocks) renamed
      to .css, carrying the entire pre-redesign design system: the periwinkle
      brand accent (--lav:#6B5CA5), 16px radii, pill shapes, diffuse shadows,
      and an Inter/Plus Jakarta Sans type stack. Loading it on screen made it
      the base layer of the cascade on every page, which is why the redesign
      needed ~900 !important declarations to fight it.

      The 8 print sheets (.beauty-*) are styled EXCLUSIVELY here, so the file
      still has to load for print - but only for print. media="print" keeps
      print output byte-identical while giving the screen a clean cascade.
      Do not edit public/legacy/legacy.css; print parity depends on it.
    -->
    <link rel="stylesheet" href="/legacy/legacy.css" media="print" />
    <!--
      Inline and dependency-free on purpose: this has to paint before Vite's
      module graph (main.tsx and everything it imports, including the
      presentation layer's own CSS) has loaded and run, or the very first
      thing staff would see is a blank white flash. boot() in main.tsx removes
      #boot-splash once the real shell has rendered, or on a boot failure.

      MANIFEST 5c: this is a loading skeleton, not a brand splash. A
      full-screen mark on a dark ground is a native-desktop idiom - the same
      idiom the MEDITECH shell was built on - and it tells staff who made the
      software rather than what is loading. What paints here is the shell's
      own geometry as neutral blocks: the app bar, the menu strip, the
      facesheet banner, the work surface, the section rail and the command
      deck, at the sizes the real chrome uses, so the first frame is the
      layout that is about to appear rather than a screen that is replaced by
      a different one.

      COUPLING TO DECLARE: these measurements mirror .cd2004-shell. Change the
      shell's chrome geometry and change this in the same commit, or boot
      flashes the wrong shape.

      Values are literal, not var(--tw-*): this block paints before the module
      graph (and therefore before tebra-tokens.css) has loaded. They are the
      same teal-900 / mint / sand the token layer defines. The typeface is a
      system stack for the same reason - @fontsource is imported by main.tsx
      and is not available this early, so asking for Inter here would only
      produce an invisible fallback.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f9f7f6;
        color: #003a43;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        transition: opacity 160ms linear;
      }
      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      /* The app bar is the one part drawn for real rather than blocked out.
         It carries the product name and the local-only disclosure, and both
         have to be legible in the first frame - PLAN 7 - not stand-ins. */
      #boot-splash .boot-appbar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 10px;
        height: 38px;
        padding: 0 12px;
        background: #003a43;
        color: #ffffff;
        font-size: 14px;
      }
      #boot-splash .boot-mark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.14);
      }
      #boot-splash .boot-product {
        font-weight: 600;
      }
      #boot-splash .boot-disclosure {
        margin-left: auto;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f8f3eb;
        color: #003a43;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.48px;
        white-space: nowrap;
      }

      #boot-splash .boot-menubar {
        flex: 0 0 auto;
        height: 32px;
        border-bottom: 1px solid #d2dcda;
        background: #ffffff;
      }
      #boot-splash .boot-banner {
        flex: 0 0 auto;
        height: 63px;
        border-bottom: 1px solid #d2dcda;
        background: #ffffff;
      }

      #boot-splash .boot-body {
        display: flex;
        flex: 1 1 auto;
        gap: 3px;
        min-height: 0;
        padding: 3px;
      }
      #boot-splash .boot-work,
      #boot-splash .boot-rail {
        border: 1px solid #d2dcda;
        border-radius: 6px;
        background: #ffffff;
      }
      #boot-splash .boot-work {
        flex: 1 1 auto;
        min-width: 0;
      }
      #boot-splash .boot-rail {
        flex: 0 0 clamp(168px, 14vw, 188px);
      }

      #boot-splash .boot-deck {
        flex: 0 0 auto;
        height: 36px;
        border-top: 1px solid #d2dcda;
        border-bottom: 1px solid #d2dcda;
        background: #ffffff;
      }
      #boot-splash .boot-statusbar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        height: 26px;
        padding: 0 12px;
        border-top: 1px solid #d2dcda;
        background: #ffffff;
        color: #1f5f67;
        font-size: 12px;
      }

      /* Placeholder blocks. MANIFEST 5c allows a slow, low-contrast pulse and
         no shimmer: a bright sweep travelling across a clinical screen reads
         as activity that is not happening. */
      #boot-splash .boot-block {
        border-radius: 4px;
        background: #f6f8f8;
        animation: boot-pulse 2.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-block {
          animation: none;
        }
      }

      #boot-splash .boot-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      #boot-splash .boot-row + .boot-row {
        border-top: 1px solid #ebf0ef;
      }
      #boot-splash .boot-block-sm {
        height: 10px;
        flex: 0 0 84px;
      }
      #boot-splash .boot-block-md {
        height: 10px;
        flex: 0 0 132px;
      }
      #boot-splash .boot-block-lg {
        height: 10px;
        flex: 1 1 auto;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading the workstation">
      <div class="boot-appbar">
        <div class="boot-mark" aria-hidden="true"></div>
        <span class="boot-product">IPMG MA Workstation</span>
        <!-- The local-only disclosure starts here, in the same chip it wears
             on the real app bar, on the very first surface staff see. It is
             not a warning banner. -->
        <span class="boot-disclosure">Local only</span>
      </div>
      <div class="boot-menubar" aria-hidden="true"></div>
      <div class="boot-banner" aria-hidden="true">
        <div class="boot-row">
          <span class="boot-block boot-block-md"></span>
          <span class="boot-block boot-block-sm"></span>
          <span class="boot-block boot-block-sm"></span>
        </div>
      </div>
      <div class="boot-body" aria-hidden="true">
        <div class="boot-work">
          <div class="boot-row">
            <span class="boot-block boot-block-sm"></span>
            <span class="boot-block boot-block-lg"></span>
          </div>
          <div class="boot-row">
            <span class="boot-block boot-block-sm"></span>
            <span class="boot-block boot-block-lg"></span>
          </div>
          <div class="boot-row">
            <span class="boot-block boot-block-sm"></span>
            <span class="boot-block boot-block-lg"></span>
          </div>
        </div>
        <div class="boot-rail">
          <div class="boot-row"><span class="boot-block boot-block-md"></span></div>
          <div class="boot-row"><span class="boot-block boot-block-md"></span></div>
          <div class="boot-row"><span class="boot-block boot-block-md"></span></div>
        </div>
      </div>
      <div class="boot-deck" aria-hidden="true"></div>
      <div class="boot-statusbar">Loading the workstation&hellip;</div>
    </div>
    <div id="app"></div>
    <div id="legacy-staging" aria-hidden="true"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
