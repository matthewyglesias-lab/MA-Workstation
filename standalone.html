/* v51.4 inline critical document CSS: keeps Clinic Letterhead outputs styled even if the external CSS file is moved, cached, or blocked. */
/* v51.4 Logo Aligned - Clean Output System — Clinic Letterhead documents
   This file is intentionally loaded after the legacy print layers. It owns only
   documents with data-document-system="v51-output-system" so app styling and
   older output experiments cannot fight the release output templates. */

:root{
  --v51-ink:#1f3446;
  --v51-text:#31485a;
  --v51-muted:#657783;
  --v51-faint:#87949c;
  --v51-green:#557e68;
  --v51-green-soft:#e8f1eb;
  --v51-line:#d8e1d8;
  --v51-line-strong:#afc3b3;
  --v51-paper:#fffefb;
  --v51-sand:#fbf7ef;
  --v51-serif:var(--serif,"Fraunces",Georgia,serif);
  --v51-sans:var(--sans,"DM Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);
}

.paper.v51-document-shell,
[data-document-system="v51-output-system"]{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  padding:0!important;
  max-width:none!important;
  color:var(--v51-ink)!important;
  font-family:var(--v51-sans)!important;
  -webkit-print-color-adjust:exact!important;
  print-color-adjust:exact!important;
}

.v51-doc-page{
  box-sizing:border-box!important;
  width:8.5in!important;
  min-height:11in!important;
  margin:0 auto 22px!important;
  padding:.5in!important;
  background:var(--v51-paper)!important;
  color:var(--v51-ink)!important;
  border:1px solid rgba(190,204,193,.72)!important;
  box-shadow:0 24px 70px rgba(31,52,70,.14)!important;
  overflow:hidden!important;
  page-break-after:always!important;
  break-after:page!important;
}
.v51-doc-page:last-child{page-break-after:auto!important;break-after:auto!important;margin-bottom:0!important;}
.v51-doc-page *{box-sizing:border-box!important;box-shadow:none!important;text-shadow:none!important;}
[data-document-system="v51-output-system"] .v51-doc-page section,
[data-document-system="v51-output-system"] .v51-doc-page article,
[data-document-system="v51-output-system"] .v51-doc-page aside,
[data-document-system="v51-output-system"] .v51-doc-page header,
[data-document-system="v51-output-system"] .v51-doc-page footer{
  box-shadow:none!important;
}
[data-document-system="v51-output-system"] .v51-doc-page section,
[data-document-system="v51-output-system"] .v51-doc-page article{
  border-left:0!important;
  border-right:0!important;
  border-top:0!important;
  border-radius:0!important;
  background:transparent!important;
}
.v51-doc-page h1,.v51-doc-page h2,.v51-doc-page h3,.v51-doc-page p,.v51-doc-page ul,.v51-doc-page ol,.v51-doc-page dl{margin-top:0!important;}
.v51-doc-page h1,.v51-doc-page h2{
  font-family:var(--v51-serif)!important;
  font-weight:500!important;
  letter-spacing:-.032em!important;
  color:var(--v51-ink)!important;
}
.v51-doc-page h1{font-size:40px!important;line-height:1.04!important;margin:0 0 8px!important;}
.v51-doc-page h2{font-size:21px!important;line-height:1.13!important;margin:0 0 8px!important;color:var(--v51-green)!important;}
.v51-doc-page h3{font:800 14px/1.22 var(--v51-sans)!important;letter-spacing:-.01em!important;color:var(--v51-ink)!important;margin:0 0 5px!important;}
.v51-doc-page p,.v51-doc-page li,.v51-doc-page dt,.v51-doc-page dd,.v51-doc-page label,.v51-doc-page span,.v51-doc-page b,.v51-doc-page small{
  font-family:var(--v51-sans)!important;
}
.v51-doc-page p{font-size:12.7px!important;line-height:1.52!important;color:var(--v51-muted)!important;margin:0 0 8px!important;}
.v51-doc-page b,.v51-doc-page strong{color:var(--v51-ink)!important;font-weight:850!important;}
.v51-subtitle{font-size:16px!important;line-height:1.38!important;color:var(--v51-green)!important;margin:0 0 14px!important;}
.v51-kicker,.v51-prof-kicker{
  display:block!important;
  font-size:9.6px!important;
  line-height:1!important;
  text-transform:uppercase!important;
  letter-spacing:.13em!important;
  color:var(--v51-green)!important;
  font-weight:950!important;
  margin:0 0 8px!important;
}
.v51-kicker::before,.v51-prof-kicker::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#7fa98e;margin:0 7px 1px 0;}

/* Masthead */
.v51-masthead{
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:18px!important;
  padding:0 0 18px!important;
  margin:0 0 29px!important;
  border-bottom:1.4px solid var(--v51-line-strong)!important;
}
.v51-brand{display:flex!important;align-items:center!important;gap:14px!important;min-width:0!important;}
.v51-brand b{display:block!important;font-family:var(--v51-serif)!important;font-weight:500!important;font-size:23px!important;line-height:1.06!important;color:var(--v51-ink)!important;letter-spacing:-.028em!important;white-space:nowrap!important;}
.v51-brand em{display:block!important;font-style:normal!important;margin-top:6px!important;font-size:11px!important;letter-spacing:.17em!important;text-transform:uppercase!important;color:var(--v51-muted)!important;font-weight:750!important;}
.v51-logo{position:relative!important;display:block!important;width:61px!important;height:54px!important;flex:0 0 61px!important;}
.v51-logo i{position:absolute!important;display:block!important;border:2px solid var(--v51-green)!important;background:transparent!important;opacity:.9!important;}
.v51-logo i:nth-child(1){width:28px;height:40px;border-radius:100% 0 100% 0;left:26px;top:1px;transform:rotate(43deg);}
.v51-logo i:nth-child(2){width:22px;height:31px;border-radius:0 100% 0 100%;left:10px;top:18px;transform:rotate(34deg);}
.v51-logo i:nth-child(3){width:55px;height:16px;border-width:0 0 2px 0;left:0;top:33px;border-radius:0 0 0 100%;transform:rotate(-8deg);}
.v51-page-meta{display:flex!important;align-items:center!important;gap:10px!important;white-space:nowrap!important;color:var(--v51-muted)!important;font-size:10px!important;letter-spacing:.14em!important;text-transform:uppercase!important;font-weight:900!important;}
.v51-page-meta i{width:1px!important;height:14px!important;background:var(--v51-line-strong)!important;display:block!important;}
.v51-page-meta span{font-size:10px!important;color:var(--v51-muted)!important;}

/* Patient guide page */
.v51-intro{display:grid!important;grid-template-columns:minmax(0,1fr) 265px!important;gap:30px!important;align-items:end!important;margin:0 0 20px!important;padding:0 0 19px!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-intro>aside{border-left:1px solid var(--v51-line)!important;padding-left:22px!important;}
.v51-intro>aside p{font-size:12.2px!important;line-height:1.43!important;color:var(--v51-muted)!important;margin:0!important;}
.v51-leaf-note{display:block!important;position:relative!important;font-weight:850!important;color:var(--v51-green)!important;margin-bottom:8px!important;padding-left:28px!important;font-size:12.5px!important;}
.v51-leaf-note::before{content:"";position:absolute;left:1px;top:0;width:16px;height:23px;border:2px solid var(--v51-green);border-radius:100% 0 100% 0;transform:rotate(35deg);}
.v51-primary-block{display:grid!important;grid-template-columns:minmax(0,1fr) 315px!important;gap:26px!important;align-items:start!important;padding:0 0 20px!important;margin:0 0 0!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-primary-copy h2{font-size:29px!important;line-height:1.08!important;color:var(--v51-ink)!important;margin:0 0 9px!important;}
.v51-primary-copy p{max-width:520px!important;}
.v51-resource-fit{color:var(--v51-text)!important;font-size:12.8px!important;}
.v51-contact-panel{border-left:1px solid var(--v51-line)!important;padding-left:23px!important;}
.v51-contact-rows{display:grid!important;gap:10px!important;margin:0!important;padding:0!important;}
.v51-contact-rows div{display:grid!important;grid-template-columns:82px minmax(0,1fr)!important;gap:12px!important;align-items:start!important;}
.v51-contact-rows dt{font-size:10px!important;line-height:1.1!important;color:var(--v51-ink)!important;font-weight:850!important;margin:0!important;}
.v51-contact-rows dd{font-size:11.2px!important;line-height:1.32!important;color:var(--v51-text)!important;margin:0!important;overflow-wrap:anywhere!important;}
.v51-info-lines{border-bottom:1px solid var(--v51-line)!important;margin:0 0 18px!important;}
.v51-info-lines>div{display:grid!important;grid-template-columns:34px 132px minmax(0,1fr)!important;gap:12px!important;align-items:start!important;padding:12px 0!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-info-lines>div:last-child{border-bottom:0!important;}
.v51-row-icon{color:var(--v51-green)!important;font-size:17px!important;line-height:1!important;text-align:center!important;}
.v51-info-lines b{font-size:12px!important;}
.v51-info-lines p{font-size:11.7px!important;line-height:1.38!important;margin:0!important;}
.v51-steps{padding:0 0 18px!important;margin:0 0 18px!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-steps h2{margin-bottom:10px!important;}
.v51-steps ol,.v51-step-list{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:22px!important;list-style:none!important;margin:0!important;padding:0!important;}
.v51-steps li,.v51-step-item{display:grid!important;grid-template-columns:30px minmax(0,1fr)!important;gap:10px!important;align-items:start!important;margin:0!important;}
.v51-steps li>b,.v51-step-item>b{width:25px!important;height:25px!important;border:1.4px solid var(--v51-line-strong)!important;border-radius:50%!important;display:grid!important;place-items:center!important;color:var(--v51-green)!important;font-size:11px!important;line-height:1!important;background:#fff!important;}
.v51-steps h3{font-size:12.6px!important;margin:0 0 3px!important;}
.v51-steps p{font-size:10.8px!important;line-height:1.32!important;margin:0!important;}
.v51-two-col{display:grid!important;grid-template-columns:minmax(0,1fr) 1fr!important;gap:34px!important;padding:0 0 18px!important;margin:0 0 17px!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-two-col>aside{border-left:1px solid var(--v51-line)!important;padding-left:34px!important;}
.v51-bullets{margin:0!important;padding:0 0 0 15px!important;color:var(--v51-muted)!important;}
.v51-bullets li{font-size:11.5px!important;line-height:1.38!important;margin:0 0 5px!important;color:var(--v51-muted)!important;}
.v51-write-lines{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;align-items:end!important;}
.v51-line-row{display:grid!important;grid-template-columns:135px minmax(0,1fr)!important;gap:10px!important;align-items:end!important;}
.v51-write-lines label,.v51-line-row label{font-size:11.7px!important;color:var(--v51-muted)!important;}
.v51-write-lines span,.v51-line-row span,.v51-simple-lines span{height:17px!important;border-bottom:1px solid #bdc8c0!important;display:block!important;}
.v51-line-row:nth-child(3) span{height:24px!important;}
.v51-footer{display:grid!important;gap:8px!important;margin-top:auto!important;border-top:1px solid var(--v51-line-strong)!important;padding-top:12px!important;text-align:center!important;}
.v51-footer p{font-size:10.8px!important;line-height:1.3!important;color:var(--v51-muted)!important;margin:0!important;}
.v51-footer small{font-size:9.1px!important;line-height:1.25!important;color:var(--v51-faint)!important;}

/* Patient options pages */
.v51-options-page h1{font-size:38px!important;margin-bottom:7px!important;}
.v51-mini-guidance{display:flex!important;align-items:center!important;gap:12px!important;border-top:1px solid var(--v51-line)!important;border-bottom:1px solid var(--v51-line)!important;padding:10px 0!important;margin:10px 0 10px!important;}
.v51-mini-guidance b{margin-right:auto!important;color:var(--v51-green)!important;}
.v51-mini-guidance span{font-size:11px!important;color:var(--v51-muted)!important;}
.v51-resource-list{border-top:1px solid var(--v51-line)!important;margin-top:14px!important;}
.v51-option-row{display:grid!important;grid-template-columns:44px minmax(0,1fr) 315px!important;gap:17px!important;align-items:start!important;padding:16px 0!important;border-bottom:1px solid var(--v51-line)!important;break-inside:avoid!important;}
.v51-option-number{width:28px!important;height:28px!important;border:1.4px solid var(--v51-line-strong)!important;border-radius:50%!important;display:grid!important;place-items:center!important;color:var(--v51-green)!important;font-size:13px!important;font-weight:900!important;}
.v51-option-main h3{font-family:var(--v51-serif)!important;font-weight:500!important;font-size:21px!important;line-height:1.12!important;letter-spacing:-.025em!important;color:var(--v51-ink)!important;margin:0 0 6px!important;}
.v51-option-main p{font-size:11.6px!important;line-height:1.38!important;margin:0!important;}
.v51-option-details{border-left:1px solid var(--v51-line)!important;padding-left:21px!important;}
.v51-option-details dl{display:grid!important;gap:7px!important;margin:0!important;}
.v51-option-details div{display:grid!important;grid-template-columns:88px minmax(0,1fr)!important;gap:10px!important;}
.v51-option-details dt{font-size:10px!important;color:var(--v51-ink)!important;font-weight:850!important;margin:0!important;}
.v51-option-details dd{font-size:10.7px!important;line-height:1.25!important;color:var(--v51-text)!important;margin:0!important;overflow-wrap:anywhere!important;}
.v51-support-notes{display:grid!important;grid-template-columns:minmax(0,1fr) 1fr!important;gap:26px!important;align-items:start!important;margin-top:14px!important;padding-top:14px!important;border-top:1px solid var(--v51-line)!important;}
.v51-support-notes aside{border-left:1px solid var(--v51-line)!important;padding-left:26px!important;}
.v51-support-notes h2{font-size:18px!important;margin-bottom:6px!important;}
.v51-support-notes p{font-size:11.5px!important;line-height:1.38!important;}
.v51-simple-lines{display:grid!important;gap:7px!important;margin-top:3px!important;}

/* Professional sibling */
.v51-professional-page h1{font-size:34px!important;margin-bottom:6px!important;}
.v51-prof-subtitle{font-size:13px!important;line-height:1.4!important;color:var(--v51-muted)!important;margin-bottom:14px!important;}
.v51-prof-identity{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;border-top:1px solid var(--v51-line)!important;border-bottom:1px solid var(--v51-line)!important;margin:12px 0 16px!important;}
.v51-prof-identity div{padding:9px 10px!important;border-right:1px solid var(--v51-line)!important;min-height:43px!important;}
.v51-prof-identity div:last-child{border-right:0!important;}
.v51-prof-identity span,.v51-prof-grid span{display:block!important;font-size:8.7px!important;text-transform:uppercase!important;letter-spacing:.1em!important;font-weight:900!important;color:var(--v51-faint)!important;margin-bottom:4px!important;}
.v51-prof-identity b,.v51-prof-grid b{font-size:11.3px!important;line-height:1.25!important;color:var(--v51-ink)!important;display:block!important;}
.v51-prof-section{margin:0 0 15px!important;padding-top:13px!important;border-top:1px solid var(--v51-line)!important;break-inside:avoid!important;}
.v51-prof-section h2{font-size:20px!important;margin-bottom:8px!important;color:var(--v51-ink)!important;}
.v51-prof-section p{font-size:11.8px!important;line-height:1.42!important;}
.v51-prof-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;border:1px solid var(--v51-line)!important;margin-top:9px!important;}
.v51-prof-grid.fax{grid-template-columns:repeat(3,minmax(0,1fr))!important;}
.v51-prof-grid div{padding:9px 10px!important;border-right:1px solid var(--v51-line)!important;border-bottom:1px solid var(--v51-line)!important;min-height:52px!important;}
.v51-prof-grid div:nth-child(4n){border-right:0!important;}
.v51-prof-grid.fax div:nth-child(3n){border-right:0!important;}
.v51-prof-grid div:nth-last-child(-n+4){border-bottom:0!important;}
.v51-prof-grid.fax div:nth-last-child(-n+3){border-bottom:0!important;}
.v51-attachment-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important;}
.v51-attachment-grid label,.v51-checkbox-list label{font-size:12px!important;line-height:1.25!important;color:var(--v51-text)!important;border:1px solid var(--v51-line)!important;padding:8px 9px!important;background:#fff!important;}
.v51-prof-table{display:grid!important;border:1px solid var(--v51-line)!important;}
.v51-prof-table>div{display:grid!important;grid-template-columns:84px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)!important;border-bottom:1px solid var(--v51-line)!important;}
.v51-prof-table>div:last-child{border-bottom:0!important;}
.v51-prof-table .head{background:#fbfcfa!important;}
.v51-prof-table span{padding:8px!important;border-right:1px solid var(--v51-line)!important;font-size:10.7px!important;line-height:1.25!important;color:var(--v51-text)!important;}
.v51-prof-table span:last-child{border-right:0!important;}
.v51-prof-table .head span{font-size:8.7px!important;text-transform:uppercase!important;letter-spacing:.1em!important;font-weight:900!important;color:var(--v51-faint)!important;}
.v51-prof-table em{display:block!important;font-style:normal!important;color:var(--v51-faint)!important;margin-top:3px!important;}
.v51-checkbox-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;}
.v51-staff-columns{display:grid!important;grid-template-columns:1fr 1fr!important;gap:18px!important;border-top:1px solid var(--v51-line)!important;padding-top:13px!important;margin-bottom:15px!important;}
.v51-staff-columns>div+div{border-left:1px solid var(--v51-line)!important;padding-left:18px!important;}
.v51-call-log{border-top:1px solid var(--v51-line)!important;padding-top:13px!important;}
.v51-call-log>div{display:grid!important;grid-template-columns:1fr .65fr .75fr 1.4fr!important;border-left:1px solid var(--v51-line)!important;border-top:1px solid var(--v51-line)!important;}
.v51-call-log span{min-height:30px!important;border-right:1px solid var(--v51-line)!important;border-bottom:1px solid var(--v51-line)!important;padding:6px 7px!important;font-size:10.5px!important;color:var(--v51-muted)!important;}
.v51-letter-copy{font-size:12px!important;line-height:1.46!important;color:var(--v51-text)!important;}
.v51-signature-row{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:16px!important;margin-top:26px!important;}
.v51-signature-row div{border-top:1px solid #9fb1a5!important;padding-top:7px!important;color:var(--v51-muted)!important;font-size:11px!important;}
.v51-note-box{white-space:pre-wrap!important;border:1px solid var(--v51-line)!important;background:#fbfcfa!important;padding:13px!important;font-size:12.3px!important;line-height:1.45!important;color:var(--v51-text)!important;}
.v51-prof-footer{margin-top:auto!important;border-top:1px solid var(--v51-line)!important;padding-top:10px!important;color:var(--v51-faint)!important;}
.v51-prof-footer p{font-size:9.5px!important;line-height:1.25!important;color:var(--v51-faint)!important;margin:0!important;}

/* Download-PDF clone uses the printable content box, not a full screen sheet. */
.pdf-export-root [data-document-system="v51-output-system"] .v51-doc-page{
  width:7.5in!important;
  min-height:9.72in!important;
  padding:0!important;

    background:#fff!important;border:0!important;box-shadow:none!important;margin:0!important;padding:0!important;width:auto!important;max-width:none!important;

    width:7.5in!important;

    padding:0!important;
    border:0!important;
    box-shadow:none!important;

    background:#fff!important;
    page-break-after:always!important;
    break-after:page!important;
  }

function scheduleRender(){
  const run = () => { renderFrame = null; render(); };
  if(typeof requestAnimationFrame === 'function'){
    if(renderFrame) cancelAnimationFrame(renderFrame);
    renderFrame = requestAnimationFrame(run);
  } else setTimeout(run, 0);
}

const $ = (s) => document.querySelector(s);
if('scrollRestoration' in history) history.scrollRestoration = 'manual';
function scrollAppToTop(){
  requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
}

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(APP_STORAGE_KEY) || 'null');
    if(!saved || typeof saved !== 'object') return {...DEFAULT_STATE};
    const validIds = new Set(resources.map(r=>r.id));
    const cleanPlan = Array.isArray(saved.plan) ? saved.plan
      .filter(item => item && validIds.has(item.id))
      .map(item => ({id:item.id, role:ROLE_ORDER.includes(item.role) ? item.role : 'Task'})) : DEFAULT_STATE.plan;
    const patient = saved.patient && typeof saved.patient === 'object' ? {
      name: String(saved.patient.name || ''),
      dob: String(saved.patient.dob || ''),
      phone: String(saved.patient.phone || ''),
      insurance: String(saved.patient.insurance || ''),
      reason: String(saved.patient.reason || '')
    } : {...DEFAULT_STATE.patient};
    return {
      ...DEFAULT_STATE,
      ...saved,
      patient,
      plan: cleanPlan.length ? sortPlan(cleanPlan) : [...DEFAULT_STATE.plan],
      drawer:null,
      planOpen:false,
      toast:'',
      lastAdded:null
    };
  }catch(err){
    console.warn('Saved state was reset:', err);
    return {...DEFAULT_STATE};
  }
}
function saveState(){
  try{
    const {toast, drawer, planOpen, lastAdded, ...persisted} = state;
    localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(persisted));
  }catch(err){ console.warn('Could not save Referral Hub state:', err); }
}
function sortPlan(plan){
  return [...plan].sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role) || a.id.localeCompare(b.id));
}

function setView(view){ state.view=view; state.planOpen=false; state.drawer=null; commit(); scrollAppToTop(); }
function setFilter(filter){ state.filter=filter; commit(); }
function setSearch(value){ state.query=value; commit({persist:false}); }
function openDrawer(id){ state.drawer=id; state.planOpen=false; commit({persist:false}); }
function closeDrawer(){ state.drawer=null; commit({persist:false}); }
function togglePlan(open){ state.planOpen = typeof open === 'boolean' ? open : !state.planOpen; state.drawer=null; commit({persist:false}); }

function addResource(id, role='Primary'){
  if(!resources.some(r=>r.id===id)) return;
  if(!ROLE_ORDER.includes(role)) role='Task';
  const existing = state.plan.find(item => item.id===id);
  if(role==='Primary'){
    state.plan = state.plan.map(item => item.role==='Primary' && item.id!==id ? {...item, role:'Backup'} : item);
  }
  if(existing){ existing.role = role; }
  else { state.plan.push({id, role}); }
  state.plan = sortPlan(state.plan);
  state.lastAdded = id;
  state.planOpen=true;
  commit();
  setTimeout(()=>{ if(state.lastAdded===id){ state.lastAdded=null; render(); } }, 900);
}
function removeResource(id){ state.plan = state.plan.filter(x=>x.id!==id); commit(); showToast('Removed from plan'); }
function updateRole(id, role){
  if(!ROLE_ORDER.includes(role)) return;
  if(role==='Primary') state.plan = state.plan.map(item => item.role==='Primary' && item.id!==id ? {...item, role:'Backup'} : item);
  const item = state.plan.find(x=>x.id===id);
  if(item) item.role=role;
  state.plan = sortPlan(state.plan);
  commit();
}
function quickStart(type){ state.filter=type; state.view='workbench'; state.planOpen=false; commit(); }

function planItems(){ return state.plan.map(item=>({ ...item, resource: resources.find(r=>r.id===item.id)})).filter(x=>x.resource); }
function selected(){ return planItems().map(x=>x.resource); }
function planGroups(){
  const groups = {Primary:[], Backup:[], Safety:[], Handout:[], Task:[]};
  planItems().forEach(item => (groups[item.role] || groups.Task).push(item));
  return groups;
}
function planScore(){
  const items = selected();
  if(!items.length) return 0;
  const base = Math.round(items.reduce((a,r)=>a+r.readiness,0)/items.length);
  const groups = planGroups();
  const primaryBonus = groups.Primary.length ? 5 : -18;
  const backupBonus = groups.Backup.length ? 4 : -10;
  const reviewPenalty = items.some(r=>r.review.includes('Needs')) ? -6 : 0;
  return Math.max(0, Math.min(100, base + primaryBonus + backupBonus + reviewPenalty));
}
function planStatus(){
  const checks = missingChecks();
  const hard = checks.filter(c=>c.required);
  const notes = checks.filter(c=>!c.required);
  const score = planScore();
  if(!state.plan.length) return {label:'Empty plan', tone:'warn'};
  if(hard.length) return {label:'Needs review', tone:'gold'};
  if(notes.length) return {label:'Ready with notes', tone:'blue'};
  if(score >= 90) return {label:'Ready to send', tone:'mint'};
  return {label:'Almost ready', tone:'blue'};
}
function missingChecks(){
  const groups = planGroups(); const items = planItems();
  const checks = [];
  if(!items.length) checks.push({level:'warn', required:true, text:'Plan is empty'});
  if(!groups.Primary.length) checks.push({level:'warn', required:true, text:'Add one primary referral option'});
  if(!groups.Backup.length) checks.push({level:'gold', required:false, text:'Recommended: add a true backup option when the first routine route may be full or not covered'});
  if(items.some(i=>i.resource.review.includes('Needs'))) checks.push({level:'gold', required:true, text:'Verify any route marked Needs review'});
  if(items.length && !groups.Safety.length) checks.push({level:'soft', required:false, text:'Optional: include crisis/safety route for higher-risk patients'});
  if(items.length && !groups.Handout.length) checks.push({level:'soft', required:false, text:'Optional: add a handout/resource-only item'});
  return checks;
}
function hardCheckCount(){ return missingChecks().filter(c=>c.required).length; }

function readinessStatus(score, review=''){
  const needs = String(review || '').toLowerCase().includes('needs');
  if(needs) return {label:'Verify first', tone:'verify'};
  if(score >= 88) return {label:'Good option', tone:'good'};
  if(score >= 78) return {label:'Use with backup', tone:'backup'};
  return {label:'Staff review', tone:'review'};
}
function progressBar(score, review=''){
  const s = readinessStatus(score, review);
  return `<span class="readiness-badge ${s.tone}">${s.label}</span>`;
}
function statCard(label,value,note,color){return `<article class="stat-card ${color}"><span>${label}</span><b>${value}</b><small>${note}</small></article>`;}
function sourceLink(r){ return r.sourceUrl ? `<a class="source-link" href="${escapeAttr(r.sourceUrl)}" target="_blank" rel="noopener">${r.source || 'Open source'}</a>` : `<b>${r.source || 'Staff verified'}</b>`; }

let v51PreviewFitFrame = null;
function clearV51PreviewFit(){
  const doc = document.querySelector('[data-ui="live-preview"] [data-document-system="v51-output-system"]');
  if(!doc) return;
  doc.style.removeProperty('zoom');
  doc.style.removeProperty('transform');
  doc.style.removeProperty('--v51-preview-scale');
  doc.classList.remove('v51-preview-scaled');
}
function fitV51Preview(){
  try{
    if(window.matchMedia && window.matchMedia('print').matches){ clearV51PreviewFit(); return; }
    const shell = document.querySelector('[data-ui="live-preview"]');
    const doc = shell && shell.querySelector('[data-document-system="v51-output-system"]');
    const page = doc && doc.querySelector('.v51-doc-page');
    if(!shell || !doc || !page) return;
    doc.style.removeProperty('zoom');
    doc.style.removeProperty('transform');
    const available = Math.max(260, shell.clientWidth - 34);
    const natural = Math.max(page.offsetWidth || 816, page.getBoundingClientRect().width || 816);
    const scale = Math.max(0.48, Math.min(1, available / natural));
    doc.style.setProperty('--v51-preview-scale', scale.toFixed(4));
    if(scale < 0.995){
      doc.style.zoom = scale.toFixed(4);
      doc.classList.add('v51-preview-scaled');
    }else{
      doc.classList.remove('v51-preview-scaled');
    }
  }catch(err){
    console.warn('v51 preview fit skipped:', err);
  }
}
function fitV51PreviewSoon(){
  if(v51PreviewFitFrame && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(v51PreviewFitFrame);
  const run = () => { v51PreviewFitFrame = null; fitV51Preview(); };
  if(typeof requestAnimationFrame === 'function') v51PreviewFitFrame = requestAnimationFrame(()=>requestAnimationFrame(run));
  else setTimeout(run, 0);
}

function roleRank(role){ const idx = ROLE_ORDER.indexOf(role); return idx === -1 ? ROLE_ORDER.length : idx; }
function normalizePlan(plan){
  const validIds = new Set(resources.map(r=>r.id));
  const byId = new Map();
  (Array.isArray(plan) ? plan : []).forEach((item)=>{
    if(!item || !validIds.has(item.id)) return;
    const incomingRole = ROLE_ORDER.includes(item.role) ? item.role : 'Task';
    const existing = byId.get(item.id);
    if(!existing || roleRank(incomingRole) < roleRank(existing.role)) byId.set(item.id, {id:item.id, role:incomingRole});
  });
  let out = [...byId.values()].sort((a,b)=>roleRank(a.role)-roleRank(b.role) || a.id.localeCompare(b.id));
  let primarySeen = false;
  out = out.map((item)=>{
    if(item.role === 'Primary'){
      if(primarySeen) return {...item, role:'Backup'};
      primarySeen = true;
    }
    return item;
  });
  if(out.length && !out.some(i=>i.role==='Primary')){
    const promoteIndex = out.findIndex(i=>i.role !== 'Safety');
    if(promoteIndex >= 0) out[promoteIndex] = {...out[promoteIndex], role:'Primary'};
  }
  return out.sort((a,b)=>roleRank(a.role)-roleRank(b.role) || a.id.localeCompare(b.id));
}
function commit({persist=true}={}){
  state.plan = normalizePlan(state.plan);

}
function addBundle(kind){
  const bundles = {
    therapy:[['sbc-dbh-access','Primary'],['rula-ca','Backup'],['sbc-ccrt','Safety']],

    sud:[['sbc-sud-sarc','Primary'],['ivrs','Backup'],['sbc-ccrt','Safety']],
    youth:[['sbc-tay-one-stop','Primary'],['victor-sb','Backup'],['family-assist','Safety']]
  };
  const chosen = bundles[kind] || bundles.therapy;
  const merged = [...state.plan];
  chosen.forEach(([id,role])=>{
    const found = merged.find(item=>item.id===id);
    if(found) found.role = role; else merged.push({id,role});
  });
  state.plan = normalizePlan(merged);
  state.lastAdded = chosen[0]?.[0] || null;
  state.planOpen = true;

}

function uniqueList(values){ return [...new Set(asList(values).map(v=>String(v).trim()).filter(Boolean))]; }
function appendUnique(base, additions){ return uniqueList([...(asList(base)), ...(asList(additions))]); }
function inferOrgName(r){
  const n = String(r.name||'');
  const known = [
    ['Lightfully', 'Lightfully Behavioral Health'], ['Loma Linda', 'Loma Linda University Health'], ['DBH', 'San Bernardino County DBH'], ['San Bernardino County', 'San Bernardino County'], ['IEHP', 'Inland Empire Health Plan'], ['Kaiser', 'Kaiser Permanente Southern California'], ['Clear Behavioral', 'Clear Behavioral Health'], ['Rogers', 'Rogers Behavioral Health'], ['NAMI', 'NAMI'], ['Victor', 'Victor Community Support Services'], ['Valley Star', 'Valley Star Behavioral Health'], ['Phoenix', 'Phoenix Community Counseling / SUD Services']
  ];
  const hit = known.find(([needle])=>n.toLowerCase().includes(needle.toLowerCase()));
  if(hit) return hit[1];
  return n.split(' — ')[0].split(' - ')[0].replace(/\s+route$/i,'').trim();
}
function inferProgramName(r){ const n=String(r.name||''); return n.includes(' — ') ? n.split(' — ').slice(1).join(' — ') : n; }
function inferLevels(r){
  const blob = searchBlob(r);
  const out=[];
  if(/iop|php|partial hospitalization|intensive outpatient|higher care|structured/.test(blob)) out.push('IOP/PHP');
  if(/sud|substance|recovery|detox|withdrawal|addiction/.test(blob)) out.push('SUD/recovery');
  if(/crisis|urgent|988|stabilization|walk-in|csu|cwic|safety/.test(blob)) out.push('Crisis/urgent');
  if(/testing|psychological|neuropsych|autism|adhd|regional center|developmental/.test(blob)) out.push('Testing/DD');
  if(/tay|youth|teen|child|family|adolescent/.test(blob)) out.push('Youth/family');
  if(/therapy|counsel|outpatient|mental health|psychiatry|medication support/.test(blob)) out.push('Outpatient therapy');
  if(/county access|access unit|dbh|medi-cal|safety-net/.test(blob)) out.push('County/plan access');
  return uniqueList(out.length?out:['General referral']);
}
function inferDelivery(r){
  const blob = searchBlob(r);
  const modes = [...asList(r.deliveryModes)];
  if(/virtual|online|telehealth|video/.test(blob)) modes.push('Virtual CA');
  if(/walk-in|csu|cwic|urgent/.test(blob)) modes.push('Walk-in/urgent');
  if(/fax/.test(blob)) modes.push('Fax/packet');
  if(/phone|call|helpline|access/.test(blob)) modes.push('Phone intake');
  if(/in-person|clinic|location|center|address|san bernardino|fontana|redlands|loma linda|riverside|ontario|upland|rancho|victorville|colton|murrieta|los angeles|westwood|encinitas|carlsbad|thousand oaks/.test(blob)) modes.push('In-person');
  return uniqueList(modes);
}
function inferAreas(r){
  const blob = searchBlob(r); const areas=[...asList(r.serviceAreas)];
  if(/san bernardino city|city of san bernardino|\bsan bernardino\b/.test(blob)) areas.push('San Bernardino city');
  if(/fontana|redlands|loma linda|colton|rialto|highland|yucaipa|east valley|west valley|victorville|hesperia|apple valley|ontario|upland|rancho cucamonga/.test(blob)) areas.push('San Bernardino County');
  if(/riverside|murrieta|moreno valley|corona|temecula/.test(blob)) areas.push('Riverside nearby');
  if(/inland empire|iehp|san bernardino county|riverside/.test(blob)) areas.push('Inland Empire');
  if(/los angeles|thousand oaks|encinitas|carlsbad|san diego|san jose|bay area|southern california|socal/.test(blob)) areas.push('SoCal/regional');
  if(/virtual|online|california/.test(blob)) areas.push('California virtual');
  return uniqueList(areas.length?areas:[r.scope||r.city||'Verify area']);
}
function inferPopulations(r){
  const blob=searchBlob(r); const pops=[...asList(r.populations)];
  if(/teen|adolescent|child|children|youth|family/.test(blob)) pops.push('Youth/teen');
  if(/tay|16 to 26|transition/.test(blob)) pops.push('TAY');
  if(/adult|older adult|senior/.test(blob)) pops.push('Adult');
  if(/autism|developmental|regional center|dd/.test(blob)) pops.push('Autism/DD');
  if(/sud|substance|recovery/.test(blob)) pops.push('SUD');
  if(!pops.length) pops.push('Verify age/population');
  return uniqueList(pops);
}
function inferPayerTags(r){
  const blob=searchBlob(r); const tags=[...asList(r.payerTags)];
  if(/medi-cal|medicaid|safety-net|county|dbh/.test(blob)) tags.push('Medi-Cal');
  if(/iehp|inland empire health plan/.test(blob)) tags.push('IEHP');
  if(/kaiser/.test(blob)) tags.push('Kaiser');
  if(/commercial|ppo|covered ca|private insurance|in network/.test(blob)) tags.push('Commercial/verify');
  if(/cash|private pay|sliding|low-cost|open path/.test(blob)) tags.push('Low-cost/self-pay');
  if(!tags.length) tags.push('Verify payer');
  return uniqueList(tags);
}
function inferRouteType(r){
  const blob=searchBlob(r);
  if(/988|crisis|urgent|csu|cwic|walk-in/.test(blob)) return 'Crisis / walk-in';
  if(/county|dbh|access unit|sarc/.test(blob)) return 'County access line';
  if(/iehp|kaiser|molina|plan/.test(blob)) return 'Health plan route';
  if(/fax|referral packet|provider referral/.test(blob)) return 'Staff fax / referral packet';
  if(/online|virtual|portal|form|website/.test(blob)) return 'Online inquiry';
  return 'Patient or staff call';
}
function inferConfidence(r){
  const txt = `${r.review||''} ${r.sourceUrl||''} ${r.source||''}`.toLowerCase();
  if(txt.includes('needs')) return {label:'Staff verify first', tone:'check'};
  if(txt.includes('web checked') || txt.includes('official') || txt.includes('county') || txt.includes('lluh') || txt.includes('lightfully')) return {label:'Good public source', tone:'verified'};
  return {label:'Use with verification', tone:'check'};
}
function firstMoveFor(r){
  const routeType = inferRouteType(r);
  if(routeType==='Crisis / walk-in') return 'Use immediately for urgent safety concerns; call or walk in, and escalate to 911/ER if imminent danger.';
  if(routeType==='County access line') return 'Start with the county access/intake route; confirm clinic, eligibility, language, and urgency before handing off.';
  if(routeType==='Health plan route') return 'Confirm benefits and authorization rules through the plan before giving an external route.';
  if(routeType==='Staff fax / referral packet') return 'Verify fax number, required records, and whether patient or clinic must initiate before sending.';
  if(routeType==='Online inquiry') return 'Confirm California eligibility, age fit, payer, and level of care before sending the patient link.';
  return 'Call intake to confirm payer, age/population fit, availability, and next step.';
}
function patientInstructionFor(r){
  const routeType=inferRouteType(r);
  if(routeType==='Crisis / walk-in') return 'If safety is urgent, call the listed crisis route or go to the urgent/walk-in center. For immediate danger, call 911 or go to the nearest ER.';
  if(routeType==='County access line') return 'Call the county/access line and ask for the correct outpatient behavioral health route for your address and insurance.';
  if(routeType==='Health plan route') return 'Call your health plan behavioral health number and ask which covered provider or program is authorized for your need.';
  if(routeType==='Online inquiry') return 'Complete the online inquiry or call admissions. Have your insurance card, DOB, phone number, and current symptoms ready.';
  return r.patient || 'Call the program and ask about intake, availability, insurance, and next steps.';
}
function buildAccessRoutes(r){
  const routeType=inferRouteType(r);
  const routes=[];
  routes.push({type:routeType, label:r.route || routeType, firstMove:firstMoveFor(r), patientStep:patientInstructionFor(r), staffConfirm:r.action || 'Confirm fit, payer, availability, and next steps.', records:r.records || 'Demographics, insurance, presenting concern'});
  if(routeType!=='Health plan route' && inferPayerTags(r).some(t=>/IEHP|Kaiser|Commercial|Medi-Cal/.test(t))) routes.push({type:'Payer verification', label:'Benefits / authorization check', firstMove:'Confirm network status and whether authorization or referral is required.', patientStep:'Have insurance card available when calling.', staffConfirm:'Document who verified coverage, date/time, reference number if provided, and any authorization requirement.', records:'Insurance card, demographics, diagnosis/need, provider referral if required'});
  if(!routeType.includes('Crisis')) routes.push({type:'Backup planning', label:'Add a backup route', firstMove:'Pair with a backup option if waitlist, coverage, or travel may block access.', patientStep:'If the first option does not work, use the backup option listed on the handout.', staffConfirm:'Keep backup route in Plan Tray before printing when possible.', records:'Same as primary route'});
  return routes;
}
function dataFlagsFor(r){
  const flags=[];
  if(!r.sourceUrl) flags.push({tone:'warn', text:'Missing source URL'});
  if(String(r.review||'').toLowerCase().includes('needs')) flags.push({tone:'warn', text:'Needs live staff verification'});
  if(inferPayerTags(r).some(t=>/verify/i.test(t)) || /verify/i.test(r.payer||'')) flags.push({tone:'warn', text:'Payer must be verified'});
  if(!asList(r.serviceAreas).length) flags.push({tone:'warn', text:'Service area unclear'});
  if(!asList(r.deliveryModes).length) flags.push({tone:'warn', text:'Delivery mode missing'});
  if(!r.best || !r.notIdeal) flags.push({tone:'warn', text:'Best-for/not-ideal needs detail'});
  if(!flags.length) flags.push({tone:'ok', text:'Core routing fields complete'});
  return flags;
}
function enrichOne(r){
  const categories = appendUnique(r.categories || r.type, r.alsoUnder || []);
  const levels = appendUnique(r.levelsOfCare || [], inferLevels(r));
  const delivery = inferDelivery(r);
  const areas = inferAreas(r);
  const populations = inferPopulations(r);
  const payerTags = inferPayerTags(r);
  const confidence = inferConfidence(r);
  const routeType = inferRouteType(r);
  const orgName = inferOrgName(r);
  const programName = inferProgramName(r);
  const firstMove = r.firstMove || firstMoveFor(r);
  const patientInstruction = r.patientInstruction || patientInstructionFor(r);
  const accessRoutes = r.accessRoutes || buildAccessRoutes(r);
  const dataQualityFlags = r.dataQualityFlags || dataFlagsFor({...r, categories, levelsOfCare:levels, deliveryModes:delivery, serviceAreas:areas, populations, payerTags});
  return {orgName, programName, routeType, levelsOfCare:levels, deliveryModes:delivery, serviceAreas:areas, populations, payerTags, categories, dataConfidence:confidence, firstMove, patientInstruction, accessRoutes, dataQualityFlags, schemaVersion:'v38'};
}
resources.forEach((r)=>Object.assign(r, enrichOne(r)));

function statusBadge(r){const c=r.dataConfidence||inferConfidence(r); return `<span class="source-confidence ${c.tone}">${html(c.label)}</span>`;}
function qualityFlagsHtml(r){return `<div class="quality-flags">${asList(r.dataQualityFlags).map(f=>`<div class="quality-flag ${f.tone}"><span>${f.tone==='ok'?'✓':'!'}</span><b>${html(f.text)}</b></div>`).join('')}</div>`;}
function accessRoutesHtml(r){return `<div class="access-route-list">${asList(r.accessRoutes).map(a=>`<div class="access-route"><strong>${html(a.type)} · ${html(a.label)}</strong><span><b>First move:</b> ${html(a.firstMove)}</span><span><b>Patient step:</b> ${html(a.patientStep)}</span><span><b>Staff confirm:</b> ${html(a.staffConfirm)}</span></div>`).join('')}</div>`;}
function routeAssistantIdeas(){
  const pt = state.patient || DEFAULT_STATE.patient;
  const text = `${pt.insurance||''} ${pt.reason||''} ${state.query||''}`.toLowerCase();
  const ideas=[];
  if(/iop|php|higher|partial|intensive|step.?up|structured/.test(text)) ideas.push({cat:'IOP PHP', color:'blue', title:'Structured care', note:'Show local/regional IOP/PHP, then California virtual options if travel is hard.'});
  if(/sud|substance|alcohol|drug|detox|recovery/.test(text)) ideas.push({cat:'SUD recovery', color:'gold', title:'SUD route', note:'Start with county SUD screening for Medi-Cal/safety-net; add recovery backup.'});
  if(/teen|child|youth|family|tay|school|minor/.test(text)) ideas.push({cat:'Youth family', color:'lavender', title:'Youth/family', note:'Keep adult-only routes out unless staff intentionally expands search.'});
  if(/testing|adhd|autism|psych|regional center|developmental/.test(text)) ideas.push({cat:'Testing DD', color:'lavender', title:'Testing/DD', note:'Separate psych testing from autism/DD and plan authorization routes.'});
  if(/crisis|urgent|danger|suicid|safety|psychosis/.test(text)) ideas.push({cat:'Crisis urgent', color:'rose', title:'Safety first', note:'Use crisis/urgent routes first; do not treat as routine therapy referral.'});
  if(/kaiser/.test(text)) ideas.push({cat:'Online CA', color:'blue', title:'Kaiser plan route', note:'Start with Kaiser internal BH access before external programs.'});
  if(/iehp|medi-cal|medicaid|uninsured/.test(text)) ideas.push({cat:'County access', color:'mint', title:'Medi-Cal / county route', note:'Start with county or plan access, then add local backup.'});
  if(!ideas.length) ideas.push({cat:'Local therapy', color:'mint', title:'Therapy route', note:'Start local/SB-first, then add an online CA backup if access is limited.'},{cat:'County access', color:'blue', title:'Plan/payer check', note:'Verify payer and access route before printing.'});
  return ideas.slice(0,3);
}
function routeAssistantPanel(){const ideas=routeAssistantIdeas(); return `<div class="panel route-assistant-card"><span class="eyebrow">Route assistant</span><h3>Suggested starting logic</h3><p>Based on patient need, insurance text, and current search. This helps staff pick a safe route without overthinking.</p><div class="assistant-steps">${ideas.map(i=>`<button class="assistant-step ${i.color}" onclick="quickStart('${i.cat}')"><b>${html(i.title)}</b><small>${html(i.note)}</small></button>`).join('')}</div></div>`;}
function dataModelStats(){
  const multi = resources.filter(r=>resourceCategories(r).length>1).length;

function searchBlob(r){return [r.name,r.orgName,r.programName,r.type,asList(r.categories).join(' '),asList(r.alsoUnder).join(' '),asList(r.serviceTypes).join(' '),asList(r.levelsOfCare).join(' '),asList(r.deliveryModes).join(' '),asList(r.serviceAreas).join(' '),asList(r.populations).join(' '),asList(r.payerTags).join(' '),r.routeType,r.firstMove,r.patientInstruction,r.route,r.fit,r.action,r.contact,r.patient,r.staff,r.best,r.notIdeal,r.records,r.city,r.scope,r.modality,r.payer,r.source].join(' ').toLowerCase();}
function resourceCard(r){const inPlan=state.plan.find(i=>i.id===r.id); return `<article class="resource-card ${r.color} ${state.lastAdded===r.id?'just-added':''}"><div class="resource-accent"></div><div class="resource-main"><div class="resource-head"><div class="route-badge">${html(r.icon)}</div><div><h4>${html(r.name)}</h4><p><strong>Best for:</strong> ${html(r.best)}</p><div class="mini-tags"><span>${html(r.orgName)}</span><span>${html(r.routeType)}</span>${statusBadge(r)}</div>${alsoUnder(r)}<div class="decision-strip"><span class="decision-pill cold">${html(asList(r.levelsOfCare)[0]||'Referral')}</span><span class="decision-pill">${html(asList(r.deliveryModes)[0]||r.modality)}</span><span class="decision-pill">${html(asList(r.payerTags)[0]||'Verify payer')}</span></div></div></div><div class="logic-row"><div class="logic-card"><span>First move</span><b>${html(r.firstMove)}</b></div><div class="logic-card"><span>Patient step</span><b>${html(r.patientInstruction)}</b></div><div class="logic-card"><span>Records</span><b>${html(r.records)}</b></div></div><div class="card-foot"><div class="foot-note"><strong>Contact:</strong> ${html(r.contact)}${inPlan?` · <span class="added-label">In plan as ${html(inPlan.role)}</span>`:''}</div><div class="card-actions"><button onclick="openDrawer('${r.id}')">Details</button><button onclick="addResource('${r.id}','Backup')">Backup</button><button class="dark" onclick="addResource('${r.id}','Primary')">${inPlan?'Make primary':'Add to plan'}</button></div></div></div></article>`;}

function planTray(){const items=planItems(); return `<aside class="plan-tray"><div class="panel tray-card"><div class="tray-head"><div><h3>Plan tray</h3><p>${planSummaryLine()}</p></div><button class="tray-open" onclick="togglePlan(true)">${svg('bag')} Open</button></div><div class="plan-health ${planStatus().tone}"><b>${planStatus().label}</b><small>${state.plan.length ? planSummaryLine() : 'Add a primary and backup route'}</small>${state.plan.length ? `<span class="plan-check-note">${hardCheckCount() ? hardCheckCount() + ' checks to clear' : 'Ready for handoff'}</span>` : ''}</div><div class="selected-list">${items.length ? items.slice(0,4).map(planMiniItem).join('') : `<div class="empty-state">Add one primary route and one backup so staff have a clean handoff.</div>`}</div><div class="before-send"><h4>Before send</h4>${beforeSendMini()}</div><button class="wide dark" onclick="setView('print')">Build printout</button><button class="wide" onclick="copyText('tebra')">Copy staff note</button></div>${routeAssistantPanel()}<div class="panel note-card"><span class="eyebrow">Next useful action</span><p>${items.length ? `Review access route and quality flags before printing.` : 'Start with patient need, payer, age, and urgency.'}</p></div></aside>`;}
function workbench(){const list=filtered(); return `<div class="workbench-view" data-ui="workbench-view"><main class="work-main">${stepper()}<div class="section-head"><div><h2>Referral workbench</h2><p>Search by need, payer, city, level of care, population, or route. Add the best option and a backup.</p></div><button class="secondary-action" onclick="setView('database')">Open database</button></div>${startHere()}<div class="panel workbench-panel">${filters()}<div class="result-bar"><b>${list.length}</b><span>matching referral option${list.length===1?'':'s'}</span><em>${state.filter==='All'?'All categories':state.filter}</em></div><div class="resource-list">${list.length ? list.map(resourceCard).join('') : `<div class="empty-results"><h3>No matching resources</h3><p>Try broader terms like “therapy,” “IOP,” “IEHP,” “teen,” “testing,” “virtual,” or “San Bernardino.”</p><button onclick="state.query=''; state.filter='All'; commit();">Clear filters</button></div>`}</div></div></main>${planTray()}</div>`;}
function auditResources(){const issues=[]; const ids=new Set(); const names=new Set(); resources.forEach(r=>{const id=String(r.id||'').toLowerCase(); if(ids.has(id)) issues.push('Duplicate id: '+r.id); ids.add(id); const nm=String(r.name||'').trim().toLowerCase(); if(names.has(nm)) issues.push('Duplicate name: '+r.name); names.add(nm); if(!resourceCategories(r).length) issues.push('Missing category facet: '+r.name); if(!asList(r.levelsOfCare).length) issues.push('Missing level of care: '+r.name); if(!asList(r.deliveryModes).length) issues.push('Missing delivery mode: '+r.name); if(!asList(r.serviceAreas).length) issues.push('Missing service area: '+r.name); if(!asList(r.populations).length) issues.push('Missing population: '+r.name); if(!asList(r.payerTags).length) issues.push('Missing payer tags: '+r.name); if(!asList(r.accessRoutes).length) issues.push('Missing access route: '+r.name); if(!r.firstMove || !r.patientInstruction) issues.push('Missing first move/patient instruction: '+r.name);}); return {issues};}
function exportCSV(){const headers=['id','orgName','programName','name','categories','levelsOfCare','deliveryModes','serviceAreas','populations','payerTags','routeType','firstMove','patientInstruction','contact','records','review','confidence','source','sourceUrl']; const csv=[headers.join(','),...resources.map(r=>headers.map(h=>{let value=h==='confidence'?(r.dataConfidence?.label||''):(r[h]??''); if(Array.isArray(value)) value=value.join('; '); return `"${String(value).replaceAll('"','""')}"`;}).join(','))].join('\n'); downloadText('ipmg-referral-resources-data-excellence.csv',csv,'text/csv'); showToast('Data excellence CSV exported');}

function resolveLetterTemplate(ctx=null){

  return `<section class="v44-builder-section soft patient-print-card" data-ui="patient-section"><div class="v44-section-title"><div><h3>Patient</h3><p>${copy}</p></div><button class="soft-link" onclick="state.patient={...DEFAULT_STATE.patient}; saveState(); render(); showToast('Patient fields cleared')">Clear</button></div><div class="v44-field-grid">${patientField('name','Patient name','Required for packet')}${patientField('dob','DOB','MM/DD/YYYY')}${patientField('phone','Phone','Callback number')}${patientField('insurance','Insurance / plan','IEHP, Kaiser, Medicare, etc.')}${patientField('reason','Reason / need','Therapy, IOP, testing, SUD, etc.')}</div></section>`;

function quickHandoutCard(){
  const internal = ['Staff worksheet','Tebra note'].includes(state.output);
  const title = internal ? 'Internal note workspace' : 'Ready for quick handout';
  const copy = internal ? 'This output is for staff follow-up, verification, or copy-ready EHR documentation. It does not need the packet form.' : 'Patient-facing outputs stay resource-first. No patient demographics are needed here.';
  const items = internal
    ? [['Staff only','Verification and follow-up language stays internal.'],['Plan based','Uses the resources selected in the Plan Tray.'],['Copy ready','Use Copy text for quick documentation.']]
    : [['No patient info','Handouts intentionally omit demographics.'],['Plan tray driven','Primary, backup, and safety routes come from the tray.'],['Soft printout','Airy, patient-friendly, and black-and-white safe.']];
  return `<section class="quick-output-card v44" data-ui="quick-output-summary"><div class="v45-quick-summary"><div class="v45-quick-head"><div><span class="eyebrow">${internal ? 'Internal output' : 'Quick output'}</span><h3>${html(title)}</h3><p>${html(copy)}</p></div><span class="v45-soft-pill">${html(state.output)}</span></div><div class="v45-quick-list">${items.map(([b,s])=>`<div><b>${html(b)}</b><span>${html(s)}</span></div>`).join('')}</div></div></section>`;

function cleanResourceValue(value, fallback=''){
  if(Array.isArray(value)) return value.filter(Boolean).join(', ') || fallback;
  return String(value || fallback || '').trim();
}
function paperDocHeader(title, subtitle='Plan-based output', options={}){
  const note = options.note || '';
  return `<header class="paper-doc-head"><div><span class="paper-kicker">IPMG Referral Hub · ${html(subtitle)}</span><h1>${html(title)}</h1>${note ? `<p class="paper-note-line">${html(note)}</p>` : ''}</div><div class="paper-date-chip">${html(paperDate())}</div></header>`;
}
function patientHeader(title, status='Plan-based output', options={}){
  const pt = state.patient || DEFAULT_STATE.patient;
  const includePatient = options.includePatient !== false;
  const includeReason = options.includeReason !== false;
  const subtitle = options.subtitle || status;
  const head = paperDocHeader(title, subtitle, options);
  if(!includePatient) return head;
  const meta = [
    ['Patient name', printableValue(pt.name,'write name')],
    ['Date of birth', printableValue(pt.dob,'MM/DD/YYYY')],
    ['Phone', printableValue(pt.phone,'callback')],
    ['Insurance / plan', printableValue(pt.insurance,'verify plan')]
  ].map(([label,value])=>`<div class="paper-detail"><span>${html(label)}</span><b>${value}</b></div>`).join('');
  const reason = includeReason ? `<div class="paper-reason-pill"><span>Reason / patient need</span><b>${pt.reason ? html(pt.reason) : '<span class="paper-missing">write reason / need</span>'}</b></div>` : '';
  return `${head}<section class="paper-identity-strip">${meta}</section>${reason}`;
}
function friendlyRole(role){
  if(role==='Primary') return 'Start here';
  if(role==='Backup') return 'Another option if needed';
  if(role==='Safety') return 'Urgent support';
  if(role==='Handout') return 'Helpful resource';
  return 'Staff follow-up';
}
function paperChipRow(values){
  const chips = values.map(v=>cleanResourceValue(v)).filter(Boolean);
  return chips.length ? `<div class="paper-tag-row">${chips.map(v=>`<span>${html(v)}</span>`).join('')}</div>` : '';
}
function paperContactBlock(resource, label='Contact route'){
  return `<aside class="paper-contact-block"><span class="paper-mini-label">${html(label)}</span><b>${html(cleanResourceValue(resource.contact, 'Call or visit website for intake'))}</b></aside>`;
}
function paperResourceMeta(resource){
  const meta = [
    ['Route', cleanResourceValue(resource.route, 'Referral route')],
    ['Location', cleanResourceValue(resource.city || resource.scope, 'Confirm service area')],
    ['Format', cleanResourceValue(resource.modality || asList(resource.deliveryModes), 'Confirm options')]
  ];
  return `<div class="paper-resource-detail-grid">${meta.map(([k,v])=>`<div><dt>${html(k)}</dt><dd>${html(v)}</dd></div>`).join('')}</div>`;
}
function patientRouteCard(item, label){
  const r = item.resource || item;
  const safeLabel = label || friendlyRole(item.role || 'Primary');
  const instruction = sentence(r.patientInstruction || r.patient, 'Call to ask about intake, availability, insurance, and next steps.');
  return `<article class="paper-resource-card patient ${html(r.color || '')}"><span class="paper-role-pill">${html(safeLabel)}</span><div class="paper-resource-top"><div class="paper-resource-dot">${html(String(r.name || 'R').trim().charAt(0) || 'R')}</div><div><h3>${html(r.name)}</h3><p>${html(instruction)}</p></div></div>${paperResourceMeta(r)}${paperChipRow([r.best, r.review])}</article>`;

function bulkRoleLabel(role){
  if(role === 'Primary') return 'Start';
  if(role === 'Backup') return 'Alt';
  if(role === 'Safety') return 'Urgent';
  if(role === 'Handout') return 'Info';
  if(role === 'Task') return 'Staff';
  return 'Option';
}
function compactPrintText(value, max=120){
  const v = String(value || '').replace(/\s+/g, ' ').trim();
  if(v.length <= max) return v;
  return v.slice(0, max - 3).replace(/[\s,;:.-]+$/,'') + '...';
}
function patientOptionsBulkTable(options){
  const rows = options.filter(Boolean).filter(item=>item.resource).map((item, index)=>{
    const r = item.resource;
    const instruction = compactPrintText(sentence(r.patientInstruction || r.patient, 'Call to ask about intake, availability, insurance, and next steps.'), 112);
    const routeBits = compactPrintText([cleanResourceValue(r.route), cleanResourceValue(r.city || r.scope), cleanResourceValue(r.modality || asList(r.deliveryModes))].filter(Boolean).join(' · '), 100);
    return `<tr><td><b>${index + 1}</b><span>${html(bulkRoleLabel(item.role || 'Route'))}</span></td><td><b>${html(compactPrintText(r.name, 78))}</b><br><span>${html(instruction)}</span></td><td><b>${html(cleanResourceValue(r.contact, 'Confirm contact route'))}</b><br><span>${html(routeBits)}</span></td></tr>`;
  }).join('');
  return `<table class="paper-table bulk-options-table"><thead><tr><th>#</th><th>Resource / patient instruction</th><th>Contact / route</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function patientCompactRouteRow(item, label){
  const r = item.resource || item;
  const safeLabel = label || friendlyRole(item.role || 'Backup');
  const instruction = sentence(r.patientInstruction || r.patient, 'Call to ask about availability, insurance, and intake steps.');
  return `<article class="paper-compact-route ${html(r.color || '')}"><div><span class="paper-role-pill">${html(safeLabel)}</span><h3>${html(r.name)}</h3><p>${html(instruction)}</p></div><aside><span>Contact</span><b>${html(cleanResourceValue(r.contact, 'Confirm contact route'))}</b><em>${html(cleanResourceValue(r.city || r.scope || r.route, 'Confirm route'))}</em></aside></article>`;
}
function staffRouteCard(item, label){
  const r = item.resource || item;
  return `<article class="paper-resource-card staff ${html(r.color || '')}"><span class="paper-role-pill">${html(label || item.role || 'Route')}</span><div class="paper-resource-top"><div class="paper-resource-dot">${html(String(r.name || 'R').trim().charAt(0) || 'R')}</div><div><h3>${html(r.name)}</h3><p>${html(sentence(r.staff || r.firstMove, 'Verify fit, payer, availability, and required records.'))}</p></div></div><div class="paper-resource-detail-grid"><div><dt>Confirm</dt><dd>${html(cleanResourceValue(r.action, 'Verify intake pathway'))}</dd></div><div><dt>Records</dt><dd>${html(cleanResourceValue(r.records, 'Confirm required records'))}</dd></div><div><dt>Contact</dt><dd>${html(cleanResourceValue(r.contact, 'Confirm contact route'))}</dd></div></div>${paperChipRow([r.route, r.city || r.scope, r.review])}</article>`;

function selectedRows(ctx, includeActions=false, rowsOverride=null){
  const rows = (rowsOverride || (ctx.items.length ? ctx.items : [ctx.primaryItem, ctx.backupItem])).filter(Boolean).filter(item=>item.resource);
  if(!rows.length) return '<div class="paper-soft-panel paper-quiet"><p>No referral routes selected yet.</p></div>';
  return `<table class="paper-table"><thead><tr><th>Role</th><th>Resource</th><th>Contact / route</th>${includeActions?'<th>Staff action</th>':''}</tr></thead><tbody>${rows.map(item=>{const r=item.resource; return `<tr><td><b>${html(friendlyRole(item.role || 'Route'))}</b></td><td>${html(r.name)}<br><span>${html(cleanResourceValue(r.city || r.scope))} · ${html(cleanResourceValue(r.modality || asList(r.deliveryModes)))}</span></td><td>${html(cleanResourceValue(r.contact))}<br><span>${html(cleanResourceValue(r.route))}</span></td>${includeActions?`<td>${html(cleanResourceValue(r.action, 'Verify pathway and required records'))}</td>`:''}</tr>`}).join('')}</tbody></table>`;
}
function safetyNote(ctx, suppressIds=[]){
  const safety = ctx.safetyItems.find(item=>item && item.resource && !suppressIds.includes(item.resource.id));
  if(safety){
    return `<section class="paper-safety-band"><h3>Need urgent help?</h3><p>If symptoms worsen or the patient feels unsafe, use the safety route below or seek urgent/emergency care.</p>${patientRouteCard(safety, 'Urgent support')}</section>`;
  }
  return `<section class="paper-safety-band"><h3>Need urgent help?</h3><p>If symptoms worsen, the patient feels unsafe, or there is immediate danger, call 911, go to the nearest ER, or use local crisis resources.</p></section>`;
}
function patientHandoutSafetyMini(ctx, suppressIds=[]){
  const safety = ctx.safetyItems.find(item=>item && item.resource && !suppressIds.includes(item.resource.id));
  if(safety && safety.resource){
    const r = safety.resource;
    return `<div class="paper-safety-mini"><span class="paper-mini-label">Urgent support</span><h3>${html(r.name)}</h3><p>For worsening symptoms or urgent safety concerns, use this route or seek emergency care.</p><p><b>${html(cleanResourceValue(r.contact, 'Use listed urgent contact route'))}</b></p></div>`;
  }
  return `<div class="paper-safety-mini"><span class="paper-mini-label">Urgent support</span><h3>Need urgent help?</h3><p>If symptoms worsen, the patient feels unsafe, or there is immediate danger, call 911, go to the nearest ER, or use local crisis resources.</p></div>`;
}

function clinicDisplayName(){
  return 'Inland Psychiatric Medical Group';
}
function clinicShortName(){
  return 'IPMG';
}
function v51Str(value, fallback=''){
  if(Array.isArray(value)) value = value.filter(Boolean).join(', ');
  const text = String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  return text || fallback;
}
function v51Date(){ return paperDate(); }
function v51PageLabel(page,total){ return `PAGE ${page} OF ${total}`; }
function v51DocLabel(kind){
  if(kind==='options') return 'Behavioral Health Referral Options';
  if(kind==='fax') return 'Referral Fax Cover Sheet';
  if(kind==='packet') return 'Behavioral Health Referral Packet';
  if(kind==='letter') return 'Referral Letter';
  if(kind==='staff') return 'Referral Workflow Worksheet';
  if(kind==='tebra') return 'Copy-ready EHR Note';

function v51ClinicMasthead(kind='guide', page=1, total=1){
  return `<header class="v51-masthead" data-doc-part="masthead"><div class="v51-brand"><span class="v51-logo" aria-label="IPMG logo"><i></i><i></i><i></i></span><div><b>${html(clinicDisplayName())}</b><em>${html(v51DocLabel(kind))}</em></div></div><div class="v51-page-meta"><span>${html(v51Date())}</span><i></i><span>${html(v51PageLabel(page,total))}</span></div></header>`;

function v51Page(inner, opts={}){
  const family = opts.family || 'patient';
  const kind = opts.kind || 'guide';
  const page = opts.page || 1;
  const total = opts.total || 1;
  const cls = ['v51-doc-page', family==='professional'?'v51-professional-page':'v51-patient-page', opts.className || ''].filter(Boolean).join(' ');
  return `<section class="${cls}" data-v51-page="${page}" data-output-family="${family}">${v51ClinicMasthead(kind,page,total)}${inner}</section>`;
}
function v51SelectedPatientItems(ctx, includeSafety=false){
  const primaryId = ctx.primary?.id;
  const seen = new Set();
  const items = [];
  (ctx.items.length ? ctx.items : [ctx.primaryItem, ctx.backupItem]).filter(Boolean).forEach(item=>{
    if(!item.resource) return;
    if(item.role==='Task') return;
    if(!includeSafety && item.role==='Safety') return;
    if(seen.has(item.resource.id)) return;
    seen.add(item.resource.id);
    items.push(item);
  });
  if(!items.length && ctx.primaryItem) items.push(ctx.primaryItem);
  return items;
}
function v51AdditionalItems(ctx){
  const primaryId = ctx.primary?.id;
  return v51SelectedPatientItems(ctx,false).filter(item=>item.resource && item.resource.id !== primaryId);
}
function v51Chunks(items, size){
  const out=[]; for(let i=0;i<items.length;i+=size) out.push(items.slice(i,i+size)); return out;
}
function v51ResourceSummary(resource){
  return sentence(resource.best || resource.fit || resource.patientInstruction || resource.patient, 'This option may help you connect with the recommended level of behavioral health care.');
}
function v51ResourceInstruction(resource){
  return sentence(resource.patientInstruction || resource.patient || resource.action, 'Call intake to ask about availability, insurance, and the next step to start care.');
}
function v51ProgramsText(resource){
  return v51Str([resource.type, resource.route, asList(resource.serviceTypes).join(', '), asList(resource.deliveryModes).join(', ')].filter(Boolean).join(', '), 'Confirm available services with intake.');
}
function v51InsuranceText(resource){
  return v51Str([resource.payer, resource.review && !String(resource.review).toLowerCase().includes('web checked') ? resource.review : '', resource.action].filter(Boolean).join('. '), 'Confirm insurance, availability, authorization, and program fit directly with the provider.');
}
function v51WhereText(resource){
  return v51Str([resource.city || resource.scope, asList(resource.serviceAreas).join(', ')].filter(Boolean).join(' · '), 'Confirm service area with intake.');
}
function v51WebsiteText(resource){
  return v51Str(resource.sourceUrl || resource.source, 'Ask intake or clinic staff for website / portal.');
}
function v51ContactRows(resource){
  const rows = [
    ['How to start', v51Str(resource.contact, 'Call or visit the website for intake instructions.')],
    ['Website / source', v51WebsiteText(resource)],
    ['Where they serve', v51WhereText(resource)],
    ['Access note', v51InsuranceText(resource)]
  ];
  return `<dl class="v51-contact-rows">${rows.map(([label,value])=>`<div><dt>${html(label)}</dt><dd>${html(value)}</dd></div>`).join('')}</dl>`;
}
function v51PrimaryResourceBlock(item){

  return `<section class="v51-primary-block" data-doc-part="primary-resource"><div class="v51-primary-copy"><span class="v51-kicker">Start here</span><h2>${html(r.name)}</h2><p class="v51-resource-fit">${html(v51ResourceSummary(r))}</p><p>${html(v51ResourceInstruction(r))}</p></div><aside class="v51-contact-panel"><span class="v51-kicker">How to reach them</span>${v51ContactRows(r)}</aside></section>
  <section class="v51-info-lines" data-doc-part="resource-details"><div><span class="v51-row-icon programs" aria-hidden="true"></span><b>Programs offered</b><p>${html(v51ProgramsText(r))}</p></div><div><span class="v51-row-icon insurance" aria-hidden="true"></span><b>Insurance note</b><p>${html(v51InsuranceText(r))}</p></div></section>`;
}
function v51NextSteps(){
  const steps = [
    ['Contact intake','Call or request services online and ask how to start care.'],

function v51AskAndNotes(resource){

function v51PatientFooter(ctx, suppressIds=[]){
  const safety = (ctx.safetyItems || []).find(item=>item.resource && !suppressIds.includes(item.resource.id));
  const safetyText = safety ? `${safety.resource.name}: ${v51Str(safety.resource.contact, 'Use urgent contact route')}. If anyone is in immediate danger, call 911.` : 'If you feel unsafe or may harm yourself or someone else, call 911, go to the nearest emergency room, or call or text 988.';

}
function v51HelpAndNotes(ctx){

}
function v51OptionRow(item, index){
  const r = item.resource || item;
  return `<article class="v51-option-row" data-doc-part="resource-row"><span class="v51-option-number">${index+1}</span><div class="v51-option-main"><h3>${html(r.name)}</h3><p>${html(v51ResourceSummary(r))}</p></div><aside class="v51-option-details"><dl><div><dt>Contact</dt><dd>${html(v51Str(r.contact, 'Confirm intake route'))}</dd></div><div><dt>Website</dt><dd>${html(v51WebsiteText(r))}</dd></div><div><dt>Location</dt><dd>${html(v51WhereText(r))}</dd></div><div><dt>Insurance / access</dt><dd>${html(v51InsuranceText(r))}</dd></div></dl></aside></article>`;

function v51AdditionalOptionsPage(items, ctx, page, total, offset=0, title='Additional Referral Options'){
  const heading = page > 2 && title.includes('Additional') ? 'Additional Referral Options, continued' : title;
  const intro = title.includes('Care Options') ? 'These are programs you may contact to ask about availability, insurance, and next steps.' : 'These are other programs you may contact if you need additional support.';
  const body = `<main class="v51-options-page"><h1>${html(heading)}</h1><p class="v51-subtitle">${html(intro)}</p><div class="v51-resource-list">${items.map((item,i)=>v51OptionRow(item, offset+i)).join('')}</div>${page===total ? v51HelpAndNotes(ctx) : ''}${v51PatientFooter(ctx, items.map(i=>i.resource?.id).filter(Boolean))}</main>`;

function patientHandout(){
  const ctx = paperContext();
  const additional = v51AdditionalItems(ctx);
  const chunks = v51Chunks(additional, 4);
  const total = 1 + chunks.length;
  const suppress = [ctx.primary?.id, ...additional.map(i=>i.resource?.id)].filter(Boolean);
  const page1Body = `<main class="v51-guide-page"><section class="v51-intro" data-doc-part="intro"><div><h1>Your Referral Guide</h1><p class="v51-subtitle">Prepared to help you connect with care.</p><p>The following program is one option based on your needs and goals. Please confirm insurance, availability, and program fit directly with the provider.</p></div><aside><span class="v51-leaf-note">Care team note</span><p>Start with the first option unless your provider gave different instructions.</p></aside></section>${v51PrimaryResourceBlock(ctx.primaryItem)}${v51NextSteps()}${v51AskAndNotes(ctx.primary)}${v51PatientFooter(ctx, suppress)}</main>`;
  const pages = [v51Page(page1Body,{family:'patient',kind:'guide',page:1,total,className:'v51-referral-guide-page'})];
  chunks.forEach((chunk,idx)=>pages.push(v51AdditionalOptionsPage(chunk, ctx, idx+2, total, idx*4)));
  return `<div class="paper v51-document-shell v51-patient-document" data-ui="print-document" data-document-type="patient-handout" data-output-theme="clinic-letterhead-v51" data-document-system="v51-output-system">${pages.join('')}</div>`;
}
function patientOptionsSheet(){
  const ctx = paperContext();

  const chunks = v51Chunks(options, 4);

  const pages = chunks.map((chunk,idx)=>{
    const isFirst = idx===0;
    const body = `<main class="v51-options-page"><h1>${isFirst ? 'Your Care Options' : 'Care Options, continued'}</h1><p class="v51-subtitle">Use this sheet to compare programs. Ask each program the same questions about availability, insurance, intake steps, and whether care is in person, virtual, or both.</p>${isFirst ? `<section class="v51-mini-guidance"><b>How to use this sheet</b><span>Start at the top</span><span>Confirm insurance</span><span>Write down the next step</span></section>` : ''}<div class="v51-resource-list">${chunk.map((item,i)=>v51OptionRow(item, idx*4+i)).join('')}</div>${idx===chunks.length-1 ? v51HelpAndNotes(ctx) : ''}${v51PatientFooter(ctx, options.map(i=>i.resource?.id).filter(Boolean))}</main>`;
    return v51Page(body,{family:'patient',kind:'options',page:idx+1,total,className:'v51-options-letterhead'});

function packetContentsRows(){

function printSpecificChecks(){
  const checks = [];
  const pt = state.patient || DEFAULT_STATE.patient;
  const groups = planGroups();
  const items = planItems();
  const packetMode = isPacketOutput(state.output);
  const internalMode = ['Staff worksheet','Tebra note'].includes(state.output);
  if(!items.length) checks.push({level:'warn', required:true, ok:false, text:'Select at least one referral route before generating output'});
  if(!groups.Primary.length) checks.push({level:'warn', required:true, ok:false, text:'Primary referral is missing'});
  else checks.push({level:'mint', required:false, ok:true, text:'Primary referral route is selected'});
  if(packetMode){
    if(!pt.name) checks.push({level:'warn', required:true, ok:false, text:'Patient name is needed for the referral packet'});
    if(!pt.dob) checks.push({level:'warn', required:true, ok:false, text:'DOB is needed for packet identity matching'});
    if(!pt.phone) checks.push({level:'gold', required:false, ok:false, text:'Patient phone is blank; receiving program may need callback info'});
    if(!pt.insurance) checks.push({level:'gold', required:false, ok:false, text:'Insurance/plan not entered; verify payer route before sending'});
    if(!pt.reason) checks.push({level:'gold', required:false, ok:false, text:'Reason/need is blank; add a short referral reason when possible'});
    if(isPacketOutput(state.output)){ const activeTemplate = resolveLetterTemplate(); const activeCfg = templateConfig(activeTemplate); if(!selectedTemplateConcerns(activeTemplate).length && !getTemplateOther(activeTemplate)) checks.push({level:'gold', required:false, ok:false, text:`${activeCfg.badge} selected; choose at least one reason/concern when known`}); }
    if(items.some(i=>String(i.resource.review||'').includes('Needs'))) checks.push({level:'gold', required:true, ok:false, text:'One or more selected routes still need live staff verification before packet send'});
    if(state.output === 'Fax cover') checks.push({level:'soft', required:false, ok:false, text:'Fax number and total pages remain fill-in fields'});
  } else if(isPatientFacingOutput(state.output)){
    checks.push({level:'mint', required:false, ok:true, text:'Patient details intentionally omitted for quick handout'});
    if(!groups.Backup.length && items.length) checks.push({level:'soft', required:false, ok:false, text:'Optional: add a true backup route if the first routine option is full'});
    if(items.some(i=>String(i.resource.review||'').includes('Needs'))) checks.push({level:'gold', required:false, ok:false, text:'Selected route needs staff verification before promising coverage or availability'});
  } else if(internalMode){
    if(!groups.Backup.length && items.length) checks.push({level:'soft', required:false, ok:false, text:'Optional: add another routine route for staff backup planning'});
    if(items.some(i=>String(i.resource.review||'').includes('Needs'))) checks.push({level:'gold', required:false, ok:false, text:'Document live verification needs in staff note'});
  }
  return checks;
}

  if(notes) return {label:'Ready with notes', tone:'blue'};
  return {label:'Print ready', tone:'mint'};

function outputPlainText(type){
  const ctx = paperContext();
  const primary = ctx.primary;
  const backup = ctx.backup;
  const pt = state.patient || DEFAULT_STATE.patient;
  const packetMode = isPacketOutput(type);
  const ptLine = packetMode ? [pt.name && `Patient: ${pt.name}`, pt.dob && `DOB: ${pt.dob}`, pt.phone && `Phone: ${pt.phone}`, pt.insurance && `Plan: ${pt.insurance}`, pt.reason && `Need: ${pt.reason}`].filter(Boolean).join(' | ') : '';
  const prefix = ptLine ? `${ptLine}\n` : '';
  const verify = `Verify availability, payer acceptance, intake criteria, and required records before promising coverage or scheduling.`;
  if(type==='Tebra note') return `${[pt.name && `Patient: ${pt.name}`, pt.dob && `DOB: ${pt.dob}`, pt.reason && `Need: ${pt.reason}`].filter(Boolean).join(' | ')}${pt.name||pt.dob||pt.reason?'\n':''}Referral plan prepared/reviewed. Primary route: ${primary.name} (${primary.route}; ${primary.contact}).${backup && backup.id !== primary.id ? ` Additional option if needed: ${backup.name} (${backup.route}; ${backup.contact}).` : ''} Staff verification: ${primary.action}. Likely records: ${primary.records}. ${verify} Patient advised to contact office if unable to connect, if coverage is denied, or if symptoms worsen.`;
  if(type==='Staff worksheet') return `${prefix}Verification script: Hi, this is IPMG calling to verify the referral pathway for ${primary.name}. Could you confirm eligibility/coverage, required records (${primary.records}), current availability, exclusion criteria, and best next step?${backup && backup.id !== primary.id ? ` Another option in plan: ${backup.name}.` : ''} ${verify}`;
  if(type==='Fax cover') return `${prefix}Referral fax cover for ${primary.name}. Please review referral information, confirm eligibility/availability, and contact patient or clinic with next steps. Records likely needed: ${primary.records}.`;
  if(type==='Referral letter'){
    const template = resolveLetterTemplate(ctx);
    const focus = [getTemplateRequest(template), selectedTemplateConcerns(template).join(', '), getTemplateOther(template), getTemplateNotes(template)].filter(Boolean).join(' | ');
    return `${prefix}Referral letter focus: ${template}. Request: ${focus || 'intake review and next-step scheduling'}. Destination: ${primary.name} for ${primary.route}. Requested next step: ${primary.action}. Records included or available: ${primary.records}. ${verify}`;
  }
  if(type==='Referral packet'){
    const template = resolveLetterTemplate(ctx);
    const focus = [getTemplateRequest(template), selectedTemplateConcerns(template).join(', '), getTemplateOther(template)].filter(Boolean).join(' | ');
    return `${prefix}Referral packet destination: ${primary.name}. Letter focus: ${template}. Requested route: ${primary.route}. Letter details: ${focus || 'not specified'}. Requested next step: ${primary.action}. Records checklist should be reviewed before sending. ${verify}`;
  }
  if(type==='Patient options sheet') return `Referral options:\n${(ctx.items.length?ctx.items:[ctx.primaryItem,ctx.backupItem]).filter(Boolean).filter(i=>i.role!=='Task' && i.resource).map(i=>`${friendlyRole(i.role)}: ${i.resource.name} — ${i.resource.contact}. ${i.resource.patientInstruction || i.resource.patient}`).join('\n')}`;
  return `Referral resource: Start with ${primary.name}. ${primary.patientInstruction || primary.patient} Contact route: ${primary.contact}.${backup && backup.id !== primary.id ? ` If that option is not available: ${backup.name}. ${backup.patientInstruction || backup.patient}` : ''} Please contact our office if you cannot reach the program, if coverage is denied, or if symptoms worsen.`;
}

function v51CssLoaded(){
  try{
    if(typeof window === 'undefined' || !window.getComputedStyle || !document || !document.body || !document.createElement) return true;
    const probe = document.createElement('div');
    probe.className = 'v51-css-probe';
    probe.setAttribute('aria-hidden','true');
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;';
    document.body.appendChild(probe);
    const value = window.getComputedStyle(probe).getPropertyValue('--v51-probe').trim();
    probe.remove();
    return value === 'loaded';
  }catch(err){
    console.warn('v51 CSS health check failed:', err);
    return true;
  }
}

  try{ window.alert('The v51.4 Clinic Letterhead print stylesheet did not load. Please reopen the full v51.4 folder/ZIP build or clear cache before printing.'); }catch(err){}
  return false;
}

function copyText(type){
  syncPatientInputs();
  syncPacketInputs();
  const text = plainText(type);
  const fallbackCopy = () => {
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('Copied to clipboard'); }
    catch(err){ showToast('Copy failed — select text from print preview'); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(fallbackCopy);
  } else fallbackCopy();
}
async function downloadColorPdf(){
  // v51.4 safety: this function is kept only for stale buttons/bookmarks.
  // It no longer uses html2canvas/jsPDF because that path could miss the Clinic Letterhead CSS.
  showToast('Use Print / Save PDF for release-quality output');
  preparePrint();
}
function preparePrint(){
  syncPatientInputs();
  syncPacketInputs();
  const required = printSpecificChecks().filter(c=>c.required && !c.ok);
  if(required.length) showToast(`${required.length} required check${required.length===1?'':'s'} before sending`);
  if(state.view !== 'print') state.view = 'print';
  render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!v51PrintPathReady()) return;
    clearV51PreviewFit();
    window.print();
  }));
}
function startNewRoute(){
  const ok = !state.plan.length || window.confirm('Start a new referral route and clear the current Plan Tray?');
  if(!ok) return;
  state.plan=[];
  state.patient={...DEFAULT_STATE.patient};
  state.packet=JSON.parse(JSON.stringify(DEFAULT_PACKET_STATE));
  state.output='Patient handout';
  state.query='';
  state.filter='All';
  state.view='dashboard';
  state.planOpen=false;
  state.drawer=null;
  commit();
  scrollAppToTop();
  showToast('Started a new route');
}

function resetAppState(){
  try{ localStorage.removeItem(APP_STORAGE_KEY); }catch(err){}
  state = {...DEFAULT_STATE, patient:{...DEFAULT_STATE.patient}, packet:JSON.parse(JSON.stringify(DEFAULT_PACKET_STATE)), plan:[...DEFAULT_STATE.plan]};
  showToast('Reset to clean sample plan');
  render();
  scrollAppToTop();
}
ensurePacketState();
window.setPacketField=setPacketField;
window.togglePacketComponent=togglePacketComponent;

window.setView=setView; window.setFilter=setFilter; window.setSearch=setSearch; window.setPatientField=setPatientField; window.preparePrint=preparePrint; window.downloadColorPdf=downloadColorPdf; window.startNewRoute=startNewRoute; window.exportCSV=exportCSV; window.addResource=addResource; window.removeResource=removeResource; window.updateRole=updateRole; window.openDrawer=openDrawer; window.closeDrawer=closeDrawer; window.setOutput=setOutput; window.togglePlan=togglePlan; window.quickStart=quickStart; window.copyText=copyText; window.addBundle=addBundle; window.showToast=showToast; window.resetAppState=resetAppState; window.commit=commit;
render();
scrollAppToTop();

  </script>
