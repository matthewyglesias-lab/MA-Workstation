<!--
  IPMG's own mark, in the Tebra palette (teal-800 ground, sand-150 glyph).
  Deliberately not Tebra's logo or wordmark: a simplified syringe naming what
  this module actually does, so the tab is identifiable as ours at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="IPMG MA Workstation">
  <rect width="24" height="24" rx="6" fill="#004952"/>
  <g transform="rotate(-45 12 12)" fill="#f8f3eb">
    <rect x="8.6" y="1.7" width="6.8" height="1.7" rx="0.85"/>
    <rect x="11.2" y="3.4" width="1.6" height="2.4"/>
    <rect x="9.2" y="5.8" width="5.6" height="9.4" rx="1.3"/>
    <rect x="11.4" y="15.2" width="1.2" height="4.8" rx="0.6"/>
  </g>
</svg>
